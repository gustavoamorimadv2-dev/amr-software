<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajuris CRM - Painel ADM</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary-color: #0c2340; --accent-color: #d4af37; --bg-color: #f5f7fa; --text-color: #333333; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--bg-color); margin: 0; color: var(--text-color); }
        header { background-color: var(--primary-color); padding: 20px 30px; text-align: center; border-bottom: 4px solid var(--accent-color); display: flex; justify-content: space-between; align-items: center; }
        header h1 { color: #ffffff; margin: 0; font-size: 24px; font-weight: 700; }
        header span { color: var(--accent-color); }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .section-box { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); margin-bottom: 30px; }
        h2 { color: var(--primary-color); border-bottom: 2px solid #eeeeee; padding-bottom: 10px; margin-top: 0; font-size: 18px; }
        .form-row { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; }
        .form-group { flex: 1; min-width: 200px; }
        label { font-weight: 600; display: block; margin-bottom: 8px; font-size: 12px; color: #555; text-transform: uppercase; }
        input { width: 100%; padding: 10px 15px; border: 1px solid #ddd; border-radius: 6px; font-family: 'Montserrat', sans-serif; font-size: 14px; background-color: #fafafa; }
        button { background-color: var(--accent-color); color: var(--primary-color); border: none; padding: 12px 20px; font-size: 14px; border-radius: 6px; cursor: pointer; font-weight: 700; text-transform: uppercase; }
        
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #fdfaf0; border-left: 4px solid var(--accent-color); padding: 20px; border-radius: 8px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card h3 { margin: 0 0 5px 0; color: var(--primary-color); font-size: 16px; }
        .card p { margin: 0; color: #666; font-size: 14px; }
        .badge { display: inline-block; margin-top: 10px; background: var(--primary-color); color: #fff; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #fff; padding: 30px; border-radius: 12px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; }
        .contract-item { padding: 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; font-size: 14px; }
    </style>
</head>
<body>

<header>
    <h1>DAP <span>ADVOCACIA</span></h1>
    <button id="btn-logout" style="width: auto; background: transparent; border: 1px solid #fff; color: #fff;">Sair</button>
</header>

<div class="container">
    <div class="section-box">
        <h2>Cadastrar Novo Colaborador</h2>
        <form id="createUserForm">
            <div class="form-row">
                <div class="form-group"><label>E-mail Corporativo</label><input type="email" id="colabEmail" required></div>
                <div class="form-group"><label>Senha de Acesso</label><input type="password" id="colabSenha" required></div>
            </div>
            <button type="submit" id="btn-criar">Criar Acesso</button>
        </form>
    </div>

    <div class="section-box">
        <h2>Desempenho da Equipe</h2>
        <div class="grid-cards" id="colaboradoresGrid">Carregando dados...</div>
    </div>
</div>

<div class="modal-overlay" id="contractModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Contratos Gerados</h3>
            <button class="close-btn" id="btn-fechar">&times;</button>
        </div>
        <div id="contractList"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAFJJAqVf3ge0WDHBpmS9E6sXKvnjuFkhw",
        authDomain: "dapapp-38637.firebaseapp.com",
        projectId: "dapapp-38637",
        storageBucket: "dapapp-38637.appspot.com",
        messagingSenderId: "628852295313",
        appId: "1:628852295313:web:1234567890abcdef123456"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // App Secundário para criar usuários sem deslogar o admin atual
    const adminApp = initializeApp(firebaseConfig, "AdminApp");
    const adminAuth = getAuth(adminApp);

    let agrupados = {};

    // Buscar Contratos e Agrupar por Colaborador
    async function carregarDados() {
        const grid = document.getElementById('colaboradoresGrid');
        grid.innerHTML = "Processando informações...";
        
        try {
            const q = query(collection(db, "contratos"), orderBy("timestamp", "desc"));
            const querySnapshot = await getDocs(q);
            agrupados = {};

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const email = data.colaboradorEmail || "Desconhecido";
                if (!agrupados[email]) agrupados[email] = [];
                agrupados[email].push(data);
            });

            renderizarCards();
        } catch (error) {
            console.error("Erro ao carregar dados", error);
            grid.innerHTML = "Erro ao buscar do banco de dados.";
        }
    }

    function renderizarCards() {
        const grid = document.getElementById('colaboradoresGrid');
        grid.innerHTML = '';

        for (const [email, contratos] of Object.entries(agrupados)) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <h3>Colaborador</h3>
                <p>${email}</p>
                <div class="badge">${contratos.length} Contrato(s)</div>
            `;
            // Função para abrir o Modal
            card.onclick = () => {
                document.getElementById('modalTitle').innerText = `Contratos de ${email}`;
                const list = document.getElementById('contractList');
                list.innerHTML = '';
                
                contratos.forEach(c => {
                    list.innerHTML += `
                        <div class="contract-item">
                            <div><strong style="color:var(--primary-color)">${c.clienteNome}</strong><br><span style="font-size:12px">${c.tipoAcao}</span></div>
                            <div style="color:#888; font-size:12px">${c.dataGeracao}</div>
                        </div>
                    `;
                });
                document.getElementById('contractModal').style.display = 'flex';
            };
            grid.appendChild(card);
        }
    }

    // Criação de novos usuários
    document.getElementById('createUserForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('colabEmail').value;
        const senha = document.getElementById('colabSenha').value;
        const btn = document.getElementById('btn-criar');
        btn.innerText = "Criando...";

        try {
            await createUserWithEmailAndPassword(adminAuth, email, senha);
            alert(`Acesso criado com sucesso para ${email}!`);
            document.getElementById('createUserForm').reset();
        } catch (error) {
            console.error(error);
            alert("Erro ao criar usuário: " + error.message);
        } finally {
            btn.innerText = "Criar Acesso";
        }
    });

    // Controles do Modal e Logout
    document.getElementById('btn-fechar').onclick = () => document.getElementById('contractModal').style.display = 'none';
    document.getElementById('btn-logout').onclick = () => {
        signOut(auth).then(() => window.location.href = 'login.html');
    };

    window.onload = carregarDados;
</script>

</body>
</html>
