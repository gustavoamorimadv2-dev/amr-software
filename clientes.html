<!DOCTYPE html>

<head>

<style>

* { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', sans-serif; }

/* Custom Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

body { 
    display:flex; height:100vh; overflow:hidden; transition:filter 0.3s; 
    background:
        radial-gradient(circle at top left,#2f3f73 0%,transparent 30%),
        radial-gradient(circle at bottom right,#0f766e 0%,transparent 25%),
        linear-gradient(135deg,#0f172a,#111827,#020617);

}

/* ================= SIDEBAR ================= */
.sidebar {
    width:80px; display:flex; flex-direction:column; align-items:center;
    padding:20px 0; flex-shrink:0; transition:width 0.4s ease; position:relative; z-index:10;

    box-shadow:0 0 40px rgba(0,0,0,0.25);
}
.sidebar.expanded { width:240px; }
.sidebar h2 {
    font-size:22px; font-weight:800; color:#fff;
    letter-spacing:1px; margin-bottom:30px; text-align:center; cursor:pointer;
    width:100%; white-space:nowrap; overflow:hidden; transition:opacity 0.3s; opacity:0;
}
.sidebar.expanded h2 { opacity:1; }

.sidebar button {
    width:calc(100% - 20px); background:transparent; border:none; color:rgba(255,255,255,0.7);
    display:flex; align-items:center; gap:15px; padding:12px 15px; margin:5px 10px;

}
.sidebar button img { width:24px; height:24px; filter:invert(1) opacity(0.7); flex-shrink:0; transition:transform 0.3s, filter 0.3s; }
.sidebar button span { display:inline-block; opacity:0; transition:opacity 0.3s; font-weight:600; }
.sidebar.expanded button span { opacity:1; }

/* ================= MAIN ================= */

header { 
    height:70px; background:transparent; border-bottom:1px solid rgba(255,255,255,0.08);

}

/* ================= RESUMO FINANCEIRO ================= */
.resumo-container {

}
.resumo-card {

.resumo-pago .value { color: #10b981; }

.resumo-aberto { border-bottom: 4px solid #f59e0b; }
.resumo-atraso { border-bottom: 4px solid #ef4444; }


/* ================= SEARCH ================= */

#buscarCliente {

#buscarCliente:focus { background:rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }

.card {

}

.card-header-info { margin-bottom: 12px; margin-top: 25px; display: flex; align-items: center; justify-content: space-between; }

.badge-boleto { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }

.boleto-item { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.boleto-info { display: flex; flex-direction: column; gap: 4px; flex: 1; }

/* Inputs Base */
label { display:block; margin-bottom:6px; font-size:12px; font-weight:600; color:rgba(255,255,255,0.7); }
input { width:100%; padding:10px 14px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:10px; color:#fff; font-size:13px; outline:none; transition:0.3s; }
input:focus { background:rgba(255,255,255,0.1); border-color: #10b981; }

.actions { display:flex; gap:12px; justify-content:flex-end; margin-top:20px; }

/* Toast */

}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import { getFirestore, collection, query, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";
import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-storage.js";

const firebaseConfig = {
    apiKey: "AIzaSyAFJJAqVf3ge0WDHBpmS9E6sXKvnjuFkhw",
    authDomain: "dapapp-38637.firebaseapp.com",
    projectId: "dapapp-38637",
    storageBucket: "dapapp-38637.appspot.com",
    messagingSenderId: "628852295313",
    appId: "1:628852295313:web:1234567890abcdef123456"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

const sidebar = document.querySelector(".sidebar");
const mainContent = document.querySelector(".main");
const container = document.getElementById("clientesContainer");
const toastEl = document.getElementById("toast");

let clienteAtual = null;
let clientesData = [];

// Hover Sidebar
sidebar.addEventListener('mouseenter', () => { sidebar.classList.add('expanded'); mainContent.classList.add('blur'); });
sidebar.addEventListener('mouseleave', () => { sidebar.classList.remove('expanded'); mainContent.classList.remove('blur'); });

// Toast
function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.style.display = 'block';
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.style.display = 'none', 3000);
}

// ================= HELPERS (LÓGICA FINANCEIRA E DATAS) =================
function converterMoedaParaFloat(valorStr) {
    if(!valorStr) return 0;
    return parseFloat(valorStr.replace(/\./g, '').replace(',', '.'));
}

function formatarFloatParaMoeda(valor) {
    return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function obterStatusEfetivo(parcela) {
    if (parcela.status === "Pago") return "Pago";
    
    if (parcela.vencimento) {
        // T23:59:59 garante que o vencimento seja até o final do dia configurado
        const dataVencimento = new Date(parcela.vencimento + "T23:59:59");
        const hoje = new Date();
        
        if (dataVencimento < hoje) {
            return "Atrasado";
        }
    }
    return "Pendente";
}

function atualizarResumoFinanceiro(listaClientes) {
    let totalPago = 0;
    let totalAberto = 0;
    let totalAtraso = 0;

    listaClientes.forEach(cliente => {
        const honorarios = cliente.honorarios || [];
        honorarios.forEach(h => {
            const valor = converterMoedaParaFloat(h.valor);
            const statusEfetivo = obterStatusEfetivo(h);

            if (statusEfetivo === "Pago") {
                totalPago += valor;
            } else if (statusEfetivo === "Atrasado") {
                totalAtraso += valor;
            } else if (statusEfetivo === "Pendente") {
                totalAberto += valor;
            }
        });
    });

    document.getElementById('resumoPago').textContent = formatarFloatParaMoeda(totalPago);
    document.getElementById('resumoAberto').textContent = formatarFloatParaMoeda(totalAberto);
    document.getElementById('resumoAtraso').textContent = formatarFloatParaMoeda(totalAtraso);
}

// ================= CARREGAR E RENDERIZAR CARDS =================
async function carregarClientes() {
    container.innerHTML = "<p style='color:rgba(255,255,255,0.5);'>Carregando clientes...</p>";
    try {
        // Busca TODOS os clientes independentemente do status
        const q = query(collection(db, "clientes"));
        const snapshot = await getDocs(q);
        clientesData = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
        
        // Na tela inicial padrão, mostra apenas os clientes "fechados"
        const clientesFechados = clientesData.filter(c => c.status === "fechado");
        exibirClientes(clientesFechados);
    } catch (error) {
        showToast("Erro ao carregar clientes.");
        console.error(error);
    }
}

function exibirClientes(lista) {
    // Atualiza o resumo financeiro do topo da página com a lista atual filtrada
    atualizarResumoFinanceiro(lista);
    
    container.innerHTML = "";
    if(lista.length === 0) {
        container.innerHTML = "<p style='color:rgba(255,255,255,0.5);'>Nenhum cliente encontrado.</p>";
        return;
    }
    
    lista.forEach(cliente => {
        const card = document.createElement("div");
        card.className = "card";
        
        let dataFechamentoStr = "";
        if (cliente.dataFechamento) {
            const dataObj = cliente.dataFechamento.toDate ? cliente.dataFechamento.toDate() : new Date(cliente.dataFechamento);
            dataFechamentoStr = dataObj.toLocaleDateString('pt-BR');
        }

        const isFechado = cliente.status === "fechado";
        const badgeStatus = isFechado 
            ? `<span style="background: rgba(16, 185, 129, 0.2); color: #10b981; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; border: 1px solid rgba(16, 185, 129, 0.3);">Fechado</span>`
            : `<span style="background: rgba(59, 130, 246, 0.2); color: #3b82f6; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; border: 1px solid rgba(59, 130, 246, 0.3);">Em Andamento</span>`;

        // INDICADOR DE DOCUMENTOS
        let docsIndicator = '';
        if (cliente.documentos && cliente.documentos.length > 0) {
            docsIndicator = `<div class="indicator-docs"><i class="fi fi-tr-clip"></i> ${cliente.documentos.length} Doc(s)</div>`;
        }

        // Mostrar Preview das parcelas (honorarios) baseadas no status em tempo real
        const honorariosHtml = (cliente.honorarios || []).slice(0, 3).map(h => {
            const statusEfetivo = obterStatusEfetivo(h);
            let corBarra = "#f59e0b"; // Pendente
            
            if (statusEfetivo === "Pago") corBarra = "#10b981";
            if (statusEfetivo === "Atrasado") corBarra = "#ef4444";

            return `
            <div class="boleto-item" style="padding:6px 10px; border-left: 3px solid ${corBarra};">
                <div class="boleto-info">
                    <span class="val" style="font-size:12px;">R$ ${h.valor}</span>
                    <span class="date" style="font-size:10px;">Venc: ${h.vencimento.split('-').reverse().join('/')} - <strong style="color:${corBarra};">${statusEfetivo}</strong></span>
                </div>
            </div>
            `;
        }).join('');

        card.innerHTML = `
            <div class="color-bar ${isFechado ? '' : 'andamento'}"></div>
            <div class="card-content">
                ${docsIndicator}
                <div class="action-badges">
                    <div class="badge-btn badge-boleto" title="Gerar Boleto" id="btnBoleto-${cliente.id}">+</div>
                </div>
                <div class="card-header-info">
                    ${badgeStatus}
                    ${dataFechamentoStr ? `<span class="card-date">${isFechado ? 'Fechado em:' : 'Data:'} ${dataFechamentoStr}</span>` : ''}
                </div>
                <h2>${cliente.nome || "Sem nome"}</h2>
                <p><strong>CPF:</strong> ${cliente.cpf || "-"}</p>
                <p><strong>Vendedor:</strong> ${cliente.vendedor || "Não informado"}</p>
                <div class="boletos-list">
                    ${honorariosHtml || '<p style="font-size:11px; color:rgba(255,255,255,0.4);">Sem parcelas geradas.</p>'}
                    ${(cliente.honorarios && cliente.honorarios.length > 3) ? '<p style="font-size:10px; color:#10b981; margin-top:5px;">+ ver mais no modal</p>' : ''}
                </div>
            </div>
        `;
        
        card.onclick = () => abrirModalCompleto(cliente);
        container.appendChild(card);

        document.getElementById(`btnBoleto-${cliente.id}`).onclick = (e) => {
            e.stopPropagation();
            abrirModalBoleto(cliente);
        };
    });
}

// ================= SISTEMA DE BUSCA AVANÇADO =================
document.getElementById('buscarCliente').addEventListener('input', (e) => {
    const termo = e.target.value.toLowerCase().trim();
    
    // Se o termo estiver vazio, volta a mostrar apenas os fechados
    if (termo === '') {
        const clientesFechados = clientesData.filter(c => c.status === "fechado");
        exibirClientes(clientesFechados);
        return;
    }

    // Caso contrário, pesquisa em TODOS os clientes
    const filtrados = clientesData.filter(c => {
        const nome = (c.nome || "").toLowerCase();
        const cpf = (c.cpf || "").toLowerCase();
        const telefone = (c.numeros || "").toLowerCase();
        const processo = (c.processo || "").toLowerCase();
        
        return nome.includes(termo) || 
               cpf.includes(termo) || 
               telefone.includes(termo) || 
               processo.includes(termo);
    });
    exibirClientes(filtrados);
});

// ================= MODAL DE INFORMAÇÃO COMPLETA =================
const modalClienteCompleto = document.getElementById('modalClienteCompleto');

window.abrirModalCompleto = function(cliente) {
    clienteAtual = cliente;
    
    // Header e Dados Pessoais
    document.getElementById('infoCompletaNome').textContent = cliente.nome || "Cliente sem nome";
    document.getElementById('dadosPessoaisContainer').innerHTML = `
        <p><strong>CPF/CNPJ:</strong> ${cliente.cpf || "Não informado"}</p>
        <p><strong>E-mail:</strong> ${cliente.email || "Não informado"}</p>
        <p><strong>Telefone:</strong> ${cliente.numeros || "Não informado"}</p>
        <p><strong>Processo:</strong> ${cliente.processo || "Não informado"}</p>
        <p><strong>Endereço:</strong> ${cliente.endereco || ""}, ${cliente.cidade || ""} - ${cliente.estado || ""}</p>
        <p><strong>CEP:</strong> ${cliente.cep || "Não informado"}</p>
    `;

    if (cliente.dataFechamento) {
        const dataObj = cliente.dataFechamento.toDate ? cliente.dataFechamento.toDate() : new Date(cliente.dataFechamento);
        document.getElementById('editDataFechamento').value = dataObj.toISOString().split('T')[0];
    } else {
        document.getElementById('editDataFechamento').value = "";
    }
    
    document.getElementById('editVendedor').value = cliente.vendedor || "";

    // Configura texto do botão com base no status atual
    const btnSalvar = document.getElementById('btnSalvarDetalhes');
    if(cliente.status === 'fechado') {
        btnSalvar.textContent = "Salvar Detalhes";
    } else {
        btnSalvar.textContent = "Fechar Cliente";
    }

    // Zera os campos ao abrir para evitar resquícios de outros clientes
    document.getElementById('addHonValor').value = "";
    document.getElementById('addHonEntrada').value = ""; // Novo campo adicionado e zerado
    document.getElementById('addHonParcelas').value = "";
    document.getElementById('addHonData').value = "";
    document.getElementById('addDocNome').value = "";
    document.getElementById('addDocFile').value = "";

    renderizarHonorarios();
    renderizarDocumentos();

    modalClienteCompleto.style.display = "flex";
}

window.fecharModalCompleto = function() {
    modalClienteCompleto.style.display = "none";
    clienteAtual = null;
    
    // Quando fechar o modal, precisamos checar se estamos no meio de uma busca ou não
    const termo = document.getElementById('buscarCliente').value.toLowerCase().trim();
    if (termo === '') {
        const clientesFechados = clientesData.filter(c => c.status === "fechado");
        exibirClientes(clientesFechados);
    } else {
        const filtrados = clientesData.filter(c => {
            const nome = (c.nome || "").toLowerCase();
            const cpf = (c.cpf || "").toLowerCase();
            const telefone = (c.numeros || "").toLowerCase();
            const processo = (c.processo || "").toLowerCase();
            
            return nome.includes(termo) || 
                   cpf.includes(termo) || 
                   telefone.includes(termo) || 
                   processo.includes(termo);
        });
        exibirClientes(filtrados);
    }
}

modalClienteCompleto.addEventListener('click', (e) => {
    if(e.target === modalClienteCompleto) fecharModalCompleto();
});

// ================= LÓGICA DE SALVAR/FECHAR CLIENTE =================
window.salvarDetalhesFechamento = async function() {
    if(!clienteAtual) return;
    
    const novaDataStr = document.getElementById('editDataFechamento').value;
    const novoVendedor = document.getElementById('editVendedor').value.trim();
    
    const btn = document.getElementById('btnSalvarDetalhes');
    btn.textContent = "Processando...";
    btn.disabled = true;

    try {
        // Agora ao salvar nesta sessão, sempre forçamos o status para "fechado"
        let atualizacoes = { 
            vendedor: novoVendedor,
            status: "fechado" 
        };
        
        if (novaDataStr) {
            const novaDataFormatada = novaDataStr + "T12:00:00"; 
            atualizacoes.dataFechamento = novaDataFormatada;
            clienteAtual.dataFechamento = novaDataFormatada;
        }

        const docRef = doc(db, "clientes", clienteAtual.id);
        await updateDoc(docRef, atualizacoes);
        
        clienteAtual.vendedor = novoVendedor;
        clienteAtual.status = "fechado"; // Atualiza o objeto na memória
        
        showToast("Cliente atualizado e fechado com sucesso!");
        btn.textContent = "Salvar Detalhes"; // Após ser fechado, altera o nome do botão para futuras edições
        
    } catch(err) {
        console.error(err);
        showToast("Erro ao atualizar os detalhes.");
    } finally {
        btn.disabled = false;
    }
}

// ================= LÓGICA DE HONORÁRIOS E ENTRADA =================

// Máscara dinâmica para Valor Total
document.getElementById('addHonValor').addEventListener('input', (e) => {
    let val = e.target.value.replace(/\D/g, '');
    if(val === '') { e.target.value = ''; return; }
    val = (parseInt(val) / 100).toFixed(2);
    e.target.value = val.replace('.', ',');
});

// Máscara dinâmica para a Entrada
document.getElementById('addHonEntrada').addEventListener('input', (e) => {
    let val = e.target.value.replace(/\D/g, '');
    if(val === '') { e.target.value = ''; return; }
    val = (parseInt(val) / 100).toFixed(2);
    e.target.value = val.replace('.', ',');
});

window.gerarHonorarios = async function() {
    if(!clienteAtual) return;

    const valorTotalStr = document.getElementById('addHonValor').value;
    const valorEntradaStr = document.getElementById('addHonEntrada').value; // Recupera valor de entrada
    const parcelasStr = document.getElementById('addHonParcelas').value;
    const dataInicial = document.getElementById('addHonData').value;

    if(!valorTotalStr) {
        showToast("Preencha ao menos o Valor Total.");
        return;
    }

    const valorFloat = parseFloat(valorTotalStr.replace(/\./g, '').replace(',', '.'));
    const entradaFloat = valorEntradaStr ? parseFloat(valorEntradaStr.replace(/\./g, '').replace(',', '.')) : 0;
    
    let parcelas = 0;
    if(parcelasStr) {
        parcelas = parseInt(parcelasStr);
    }

    // Validação de Lógica Financeira
    if (entradaFloat > valorFloat) {
        showToast("A entrada não pode ser maior que o valor total.");
        return;
    }

    let novosHonorarios = clienteAtual.honorarios || [];
    
    // Se existir entrada, processa e abate do saldo
    if (entradaFloat > 0) {
        const hoje = new Date().toISOString().split('T')[0];
        novosHonorarios.push({
            id_parcela: `hon_${Date.now()}_entrada`,
            parcela: `Entrada`,
            valor: entradaFloat.toFixed(2).replace('.', ','),
            vencimento: hoje,
            status: "Pendente" // Lança pendente para forçar a conciliação/confirmação
        });
    }

    // Processa o residual e gera as faturas recorrentes
    if (parcelas > 0 && dataInicial) {
        const valorRestante = valorFloat - entradaFloat;
        const valorParcela = (valorRestante / parcelas).toFixed(2).replace('.', ',');
        let dataAtualObj = new Date(dataInicial + "T00:00:00");

        for(let i = 0; i < parcelas; i++) {
            let dataParcela = new Date(dataAtualObj);
            dataParcela.setMonth(dataParcela.getMonth() + i);
            
            novosHonorarios.push({
                id_parcela: `hon_${Date.now()}_${i}`,
                parcela: `${i + 1}/${parcelas}`,
                valor: valorParcela,
                vencimento: dataParcela.toISOString().split('T')[0],
                status: "Pendente"
            });
        }
    } else if (entradaFloat < valorFloat) {
        showToast("Preencha Qtd. Parcelas e Vencimento para gerar o saldo restante.");
        return;
    }

    try {
        const docRef = doc(db, "clientes", clienteAtual.id);
        await updateDoc(docRef, { honorarios: novosHonorarios });
        
        clienteAtual.honorarios = novosHonorarios;
        renderizarHonorarios();
        showToast("Honorários gerados e salvos!");
    } catch(err) {
        console.error(err);
        showToast("Erro ao salvar honorários.");
    }
}

window.atualizarStatusParcela = async function(index, novoStatus) {
    if(!clienteAtual || !clienteAtual.honorarios) return;

    // Salva o valor real no banco (sempre "Pago" ou "Pendente")
    clienteAtual.honorarios[index].status = novoStatus;

    try {
        const docRef = doc(db, "clientes", clienteAtual.id);
        await updateDoc(docRef, { honorarios: clienteAtual.honorarios });
        
        renderizarHonorarios(); 
        showToast(`Parcela atualizada para ${novoStatus}!`);
    } catch(err) {
        console.error(err);
        showToast("Erro ao atualizar o status da parcela.");
    }
}

function renderizarHonorarios() {
    const containerHon = document.getElementById('listaHonorariosGerados');
    const honorarios = clienteAtual.honorarios || [];
    
    if(honorarios.length === 0) {
        containerHon.innerHTML = '<p style="font-size:12px; color:rgba(255,255,255,0.4);">Nenhum honorário registrado.</p>';
        return;
    }

    containerHon.innerHTML = honorarios.map((h, index) => {
        const statusEfetivo = obterStatusEfetivo(h);
        const isPagoNoBanco = h.status === "Pago"; // Valor puro salvo no BD
        
        let selectClass = 'status-aberto';
        let textoOpcaoAberto = 'Em Aberto';
        
        if (statusEfetivo === 'Pago') {
            selectClass = 'status-pago';
        } else if (statusEfetivo === 'Atrasado') {
            selectClass = 'status-atrasado';
            textoOpcaoAberto = 'Em Atraso'; // Muda a nomenclatura dinamicamente
        }

        return `
        <div class="boleto-item">
            <div class="boleto-info">
                <span style="font-size:12px; font-weight:bold; color:#fff;">Parcela ${h.parcela}</span>
                <span class="val">R$ ${h.valor}</span>
                <span class="date">Vencimento: ${h.vencimento.split('-').reverse().join('/')}</span>
            </div>
            
            <select class="status-select ${selectClass}" onchange="atualizarStatusParcela(${index}, this.value)">
                <option value="Pendente" ${!isPagoNoBanco ? 'selected' : ''}>${textoOpcaoAberto}</option>
                <option value="Pago" ${isPagoNoBanco ? 'selected' : ''}>Pago</option>
            </select>
        </div>
    `}).join('');
}

// ================= LÓGICA DE DOCUMENTOS (STORAGE) =================
window.anexarDocumento = async function() {
    if(!clienteAtual) return;

    let nomeInput = document.getElementById('addDocNome').value.trim();
    const fileInput = document.getElementById('addDocFile');
    const file = fileInput.files[0];
    const btn = document.getElementById('btnAnexarDoc');

    if(!file) {
        showToast("Selecione um arquivo para anexar.");
        return;
    }
    
    if(!nomeInput) {
        nomeInput = file.name;
    }

    btn.textContent = "Enviando...";
    btn.disabled = true;

    try {
        const storageRef = ref(storage, `documentos_clientes/${clienteAtual.id}/${Date.now()}_${file.name}`);
        const uploadTask = await uploadBytesResumable(storageRef, file);
        const downloadURL = await getDownloadURL(uploadTask.ref);

        let documentos = clienteAtual.documentos || [];
        documentos.push({
            nome: nomeInput,
            url: downloadURL,
            dataEnvio: new Date().toISOString()
        });

        const docRef = doc(db, "clientes", clienteAtual.id);
        await updateDoc(docRef, { documentos: documentos });

        clienteAtual.documentos = documentos;
        
        document.getElementById('addDocNome').value = "";
        fileInput.value = "";
        
        renderizarDocumentos();
        showToast("Documento anexado com sucesso!");

    } catch (error) {
        console.error("Erro no upload:", error);
        showToast("Erro ao anexar arquivo. Verifique regras do Storage.");
    } finally {
        btn.textContent = "Anexar Documento";
        btn.disabled = false;
    }
}

function renderizarDocumentos() {
    const containerDocs = document.getElementById('listaDocsContainer');
    const documentos = clienteAtual.documentos || [];

    if (documentos.length === 0) {
        containerDocs.innerHTML = '<p style="font-size:12px; color:rgba(255,255,255,0.4);">Nenhum documento anexado.</p>';
        return;
    }

    containerDocs.innerHTML = documentos.map(doc => `
        <div class="doc-item">
            <div class="doc-info">
                <i class="fi fi-tr-document"></i>
                <span title="${doc.nome}">${doc.nome}</span>
            </div>
            <a href="${doc.url}" target="_blank" class="btn-view-doc">Visualizar</a>
        </div>
    `).join('');
}
