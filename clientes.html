
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes Fechados - Gerar Boletos</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-thin-rounded/css/uicons-thin-rounded.css'>

<style>

* { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', sans-serif; }

/* Custom Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

body { 
    display:flex; height:100vh; overflow:hidden; transition:filter 0.3s; 
    background:
        radial-gradient(circle at top left,#2f3f73 0%,transparent 30%),
        radial-gradient(circle at bottom right,#0f766e 0%,transparent 25%),
        linear-gradient(135deg,#0f172a,#111827,#020617);
    color: #fff;
}

/* ================= SIDEBAR ================= */
.sidebar {
    width:80px; display:flex; flex-direction:column; align-items:center;
    padding:20px 0; flex-shrink:0; transition:width 0.4s ease; position:relative; z-index:10;
    backdrop-filter:blur(30px); background:rgba(255,255,255,0.06); border-right:1px solid rgba(255,255,255,0.08);
    box-shadow:0 0 40px rgba(0,0,0,0.25);
}
.sidebar.expanded { width:240px; }
.sidebar h2 {
    font-size:22px; font-weight:800; color:#fff;
    letter-spacing:1px; margin-bottom:30px; text-align:center; cursor:pointer;
    width:100%; white-space:nowrap; overflow:hidden; transition:opacity 0.3s; opacity:0;
}
.sidebar.expanded h2 { opacity:1; }

.sidebar button {
    width:calc(100% - 20px); background:transparent; border:none; color:rgba(255,255,255,0.7);
    display:flex; align-items:center; gap:15px; padding:12px 15px; margin:5px 10px;
    cursor:pointer; border-radius:14px; transition:all 0.3s; font-size:14px;
    white-space:nowrap; overflow:hidden;
}
.sidebar button img { width:24px; height:24px; filter:invert(1) opacity(0.7); flex-shrink:0; transition:transform 0.3s, filter 0.3s; }
.sidebar button span { display:inline-block; opacity:0; transition:opacity 0.3s; font-weight:600; }
.sidebar.expanded button span { opacity:1; }
.sidebar button:hover img { transform:scale(1.1); filter:invert(1) opacity(1); }
.sidebar button:hover { background:rgba(255,255,255,0.1); color:#fff; }

/* ================= MAIN ================= */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; transition:filter 0.3s; }
.main.blur { filter:blur(5px) brightness(0.7); }

header { 
    height:70px; background:transparent; border-bottom:1px solid rgba(255,255,255,0.08); 
    display:flex; align-items:center; justify-content:space-between; padding:0 30px; flex-shrink:0; 
}
header h1 { font-size:24px; color:#fff; font-weight:800; }

/* ================= SEARCH ================= */
.search-container { padding: 20px 30px 0 30px; }
#buscarCliente {
    padding:12px 16px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1);
    border-radius:12px; color:#fff; font-size: 14px; outline: none; transition: 0.3s;
    backdrop-filter: blur(10px); width: 300px;
}
#buscarCliente:focus { background:rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }
#buscarCliente::placeholder { color: rgba(255,255,255,0.5); }

/* ================= CARDS ================= */
.container { flex:1; overflow-y:auto; padding:30px; display:flex; flex-wrap:wrap; gap:25px; align-content: flex-start; }

.card { 
    display:flex; background:rgba(255,255,255,0.05); backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.08); border-radius:16px; box-shadow:0 8px 30px rgba(0,0,0,0.15);
    cursor:pointer; overflow:hidden; transition:transform 0.3s, background 0.3s; 
    flex-direction:row; position:relative; width:340px; max-height: 300px;
}
.card:hover { transform:translateY(-5px); background:rgba(255,255,255,0.08); }
.card .color-bar { width:6px; height:100%; border-radius:16px 0 0 16px; background:#10b981; flex-shrink: 0;}

.card-content { padding:20px; flex:1; display:flex; flex-direction:column; overflow:hidden; }
.card h2 { font-size:18px; margin-bottom:8px; color:#fff; font-weight:700; }
.card p { font-size:13px; color:rgba(255,255,255,0.7); margin:2px 0; }
.card p strong { color: #fff; font-weight: 600; }

/* Lista de Boletos */
.boletos-list {
    margin-top: 15px; display: flex; flex-direction: column; gap: 8px;
    overflow-y: auto; padding-right: 5px; flex: 1;
}
.boleto-item {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.05);
    padding: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center;
}
.boleto-info { display: flex; flex-direction: column; gap: 4px; }
.boleto-info .val { font-size: 14px; font-weight: 700; color: #10b981; }
.boleto-info .date { font-size: 11px; color: rgba(255,255,255,0.5); }
.btn-copy {
    background: rgba(255,255,255,0.1); border: none; color: #fff; width: 32px; height: 32px;
    border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: 0.2s;
}
.btn-copy:hover { background: rgba(255,255,255,0.2); }

.add-boleto-badge {
    position: absolute; top: 15px; right: 15px; background: rgba(16, 185, 129, 0.2);
    color: #10b981; width: 32px; height: 32px; border-radius: 10px; display: flex;
    align-items: center; justify-content: center; font-size: 18px; font-weight: bold;
    border: 1px solid rgba(16, 185, 129, 0.3); transition: 0.3s;
}
.card:hover .add-boleto-badge { background: #10b981; color: #fff; }

/* ================= MODAL ================= */
.modal-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(8px); justify-content:center; align-items:center; z-index:50; }
.modal { background:#0f172a; border:1px solid rgba(255,255,255,0.1); padding:30px; border-radius:24px; min-width:320px; max-width:600px; width:100%; max-height:90vh; overflow-y:auto; box-shadow:0 20px 50px rgba(0,0,0,0.5); }
.modal h3 { margin-bottom:25px; font-size:22px; font-weight:700; color:#fff; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
.form-grid .full-width { grid-column: 1 / -1; }

.modal label { display:block; margin-bottom:6px; font-size:13px; font-weight:600; color:rgba(255,255,255,0.7); }
.modal input { 
    width:100%; padding:12px 16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
    border-radius:12px; color:#fff; font-size:14px; outline:none; transition:0.3s;
}
.modal input:focus { background:rgba(255,255,255,0.1); border-color: #10b981; }
.modal input::placeholder { color: rgba(255,255,255,0.3); }

/* ================= BUTTONS ================= */
.modal .actions { display:flex; gap:12px; justify-content:flex-end; margin-top:30px; }
.btn { padding:12px 20px; border-radius:12px; border:0; cursor:pointer; font-weight:600; font-size:14px; transition:0.3s; display: flex; align-items: center; gap: 8px;}
.btn.primary { background: linear-gradient(135deg, #10b981, #059669); color:#fff; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
.btn.primary:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(16, 185, 129, 0.4); }
.btn.ghost { background:rgba(255,255,255,0.1); color:#fff; }
.btn.ghost:hover { background:rgba(255,255,255,0.2); }

/* Toast */
.toast {
    position:fixed; right:30px; bottom:30px; background:rgba(255,255,255,0.1);
    backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); color:#fff;
    padding:12px 20px; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.4);
    display:none; z-index:9999; font-size:14px; font-weight: 500;
}

</style>
</head>
<body>

<div class="sidebar">
    <h2 onclick="window.location.href='dashboard.html'">AMR ADV</h2>
    <button onclick="location.href='crm.html'"><img src="https://img.icons8.com/ios-filled/50/ffffff/dashboard.png"/><span>CRM</span></button>
    <button onclick="window.location.href='relatorios.html'"><img src="https://img.icons8.com/ios-filled/50/ffffff/combo-chart.png"/><span>Relatórios</span></button>
    <button onclick="window.location.href='agenda.html'"><img src="https://img.icons8.com/ios-filled/50/ffffff/calendar.png"/><span>Agenda</span></button>
    <button onclick="window.location.href='contatos.html'"><img src="https://img.icons8.com/ios-filled/50/ffffff/contacts.png"/><span>Contatos</span></button>
    <button onclick="window.location.href='clientes.html'"><img src="https://img.icons8.com/ios-filled/50/ffffff/user-group-man-man.png"/><span>Clientes</span></button>
    <button onclick="window.location.href='processos.html'"><img src="https://img.icons8.com/ios-filled/50/ffffff/file.png"/><span>Processos</span></button>
    <button><img src="https://img.icons8.com/ios-filled/50/ffffff/settings.png"/><span>Configurações</span></button>
</div>

<div class="main">
    <header>
        <h1>Clientes Fechados</h1>
    </header>

    <div class="search-container">
        <input type="text" id="buscarCliente" placeholder="Buscar cliente por nome...">
    </div>

    <div class="container" id="clientesContainer"></div>
</div>

<div id="modalBoleto" class="modal-backdrop">
    <div class="modal">
        <h3>Gerar Boleto</h3>
        
        <div class="form-grid">
            <div class="full-width">
                <label>Nome Completo</label>
                <input type="text" id="modalNome" placeholder="Nome do cliente">
            </div>
            
            <div>
                <label>CPF/CNPJ</label>
                <input type="text" id="modalCpf" placeholder="Somente números">
            </div>
            <div>
                <label>Telefone</label>
                <input type="text" id="modalTelefone" placeholder="(11) 99999-9999">
            </div>

            <div class="full-width">
                <label>E-mail</label>
                <input type="email" id="modalEmail" placeholder="email@exemplo.com">
            </div>

            <div>
                <label>CEP</label>
                <input type="text" id="modalCep" placeholder="00000-000">
            </div>
            <div>
                <label>Endereço</label>
                <input type="text" id="modalEndereco" placeholder="Rua, número">
            </div>

            <div>
                <label>Cidade</label>
                <input type="text" id="modalCidade" placeholder="Cidade">
            </div>
            <div>
                <label>Estado (UF)</label>
                <input type="text" id="modalEstado" placeholder="Ex: SP" maxlength="2">
            </div>

            <div>
                <label>Valor (R$)</label>
                <input type="text" id="modalValor" placeholder="0,00">
            </div>
            <div>
                <label>Vencimento</label>
                <input type="date" id="modalVencimento">
            </div>
        </div>

        <div class="actions">
            <button class="btn ghost" id="btnCancel">Cancelar</button>
            <button class="btn primary" id="confirmBoletoBtn">Gerar Boleto</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAFJJAqVf3ge0WDHBpmS9E6sXKvnjuFkhw",
    authDomain: "dapapp-38637.firebaseapp.com",
    projectId: "dapapp-38637",
    storageBucket: "dapapp-38637.appspot.com",
    messagingSenderId: "628852295313",
    appId: "1:628852295313:web:1234567890abcdef123456"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const sidebar = document.querySelector(".sidebar");
const mainContent = document.querySelector(".main");
const container = document.getElementById("clientesContainer");
const toastEl = document.getElementById("toast");

let clienteAtualId = null;
let clientesData = [];

// Hover Sidebar
sidebar.addEventListener('mouseenter', () => { sidebar.classList.add('expanded'); mainContent.classList.add('blur'); });
sidebar.addEventListener('mouseleave', () => { sidebar.classList.remove('expanded'); mainContent.classList.remove('blur'); });

// Toast Notification
function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.style.display = 'block';
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.style.display = 'none', 3000);
}

// Carregar Dados
async function carregarClientes() {
    container.innerHTML = "<p style='color:rgba(255,255,255,0.5);'>Carregando clientes...</p>";
    try {
        const q = query(collection(db, "clientes"), where("status", "==", "fechado"));
        const snapshot = await getDocs(q);
        clientesData = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
        exibirClientes(clientesData);
    } catch (error) {
        showToast("Erro ao carregar clientes.");
        console.error(error);
    }
}

// Renderizar Cards
function exibirClientes(lista) {
    container.innerHTML = "";
    if(lista.length === 0) {
        container.innerHTML = "<p style='color:rgba(255,255,255,0.5);'>Nenhum cliente encontrado.</p>";
        return;
    }
    
    lista.forEach(cliente => {
        const card = document.createElement("div");
        card.className = "card";
        
        const boletosHtml = (cliente.boletos || []).map(b => `
            <div class="boleto-item">
                <div class="boleto-info">
                    <span class="val">R$ ${b.valor}</span>
                    <span class="date">Venc: ${b.vencimento.split('-').reverse().join('/')}</span>
                </div>
                <button class="btn-copy" title="Copiar Linha Digitável" onclick="copiarCodigo('${b.codigo || 'Sem código'}', event)">
                    <i class="fi fi-tr-copy"></i>
                </button>
            </div>
        `).join('');

        card.innerHTML = `
            <div class="color-bar"></div>
            <div class="card-content">
                <div class="add-boleto-badge">+</div>
                <h2>${cliente.nome || "Sem nome"}</h2>
                <p><strong>CPF/CNPJ:</strong> ${cliente.cpf || "-"}</p>
                <div class="boletos-list" id="boletos-${cliente.id}">
                    ${boletosHtml || '<p style="font-size:12px; color:rgba(255,255,255,0.4); margin-top:10px;">Nenhum boleto gerado.</p>'}
                </div>
            </div>
        `;
        
        card.onclick = (e) => {
            if(!e.target.closest('.btn-copy')) abrirModal(cliente, cliente.id);
        };
        
        container.appendChild(card);
    });
}

// Copiar Código de Barras
window.copiarCodigo = function(codigo, event) {
    event.stopPropagation();
    if(codigo === 'Sem código') {
        showToast("Este boleto não possui linha digitável registrada.");
        return;
    }
    navigator.clipboard.writeText(codigo).then(() => {
        showToast("Linha digitável copiada!");
    });
}

// Filtro busca
document.getElementById('buscarCliente').addEventListener('input', (e) => {
    const termo = e.target.value.toLowerCase();
    const filtrados = clientesData.filter(c => (c.nome || "").toLowerCase().includes(termo));
    exibirClientes(filtrados);
});

// Referências do Modal
const modal = document.getElementById('modalBoleto');
const modalNome = document.getElementById('modalNome');
const modalCpf = document.getElementById('modalCpf');
const modalEmail = document.getElementById('modalEmail');
const modalTelefone = document.getElementById('modalTelefone');
const modalCep = document.getElementById('modalCep');
const modalEndereco = document.getElementById('modalEndereco');
const modalCidade = document.getElementById('modalCidade');
const modalEstado = document.getElementById('modalEstado');
const modalValor = document.getElementById('modalValor');
const modalVencimento = document.getElementById('modalVencimento');
const confirmBtn = document.getElementById('confirmBoletoBtn');

// Auto-Preenchimento ViaCEP
modalCep.addEventListener('blur', async (e) => {
    let cep = e.target.value.replace(/\D/g, '');
    if (cep.length === 8) {
        try {
            const res = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
            const data = await res.json();
            if (!data.erro) {
                modalEndereco.value = data.logradouro + (data.bairro ? `, ${data.bairro}` : '');
                modalCidade.value = data.localidade;
                modalEstado.value = data.uf;
                showToast("Endereço preenchido!");
            }
        } catch (err) {
            console.error(err);
        }
    }
});

// Máscara de Moeda Real-Time
modalValor.addEventListener('input', (e) => {
    let val = e.target.value.replace(/\D/g, '');
    if(val === '') { e.target.value = ''; return; }
    val = (parseInt(val) / 100).toFixed(2);
    e.target.value = val.replace('.', ',');
});

function abrirModal(cliente, id) {
    clienteAtualId = id;
    modalNome.value = cliente.nome || "";
    modalCpf.value = cliente.cpf || "";
    modalEmail.value = cliente.email || "";
    const tel = cliente.numeros ? cliente.numeros.split(',')[0].trim() : "";
    modalTelefone.value = tel;
    modalCep.value = cliente.cep || "";
    modalEndereco.value = cliente.endereco || "";
    modalCidade.value = cliente.cidade || "";
    modalEstado.value = cliente.estado || "";
    modalValor.value = "";
    
    const date = new Date();
    date.setDate(date.getDate() + 5);
    modalVencimento.value = date.toISOString().split('T')[0];
    
    modal.style.display = "flex";
}

document.getElementById('btnCancel').onclick = () => { modal.style.display = "none"; clienteAtualId = null; };

modal.addEventListener('click', (e) => {
    if(e.target === modal) { modal.style.display = 'none'; }
});

confirmBtn.onclick = async () => {
    if(!clienteAtualId) return;
    
    const nome = modalNome.value.trim();
    const cpf = modalCpf.value.trim();
    const email = modalEmail.value.trim();
    const telefone = modalTelefone.value.trim();
    const cep = modalCep.value.trim();
    const endereco = modalEndereco.value.trim();
    const cidade = modalCidade.value.trim();
    const estado = modalEstado.value.trim();
    const valorVisual = modalValor.value.trim();
    const vencimento = modalVencimento.value;

    if(!nome || !cpf || !valorVisual || !vencimento) {
        showToast("Preencha Nome, CPF, Valor e Vencimento!");
        return;
    }

    const valor = valorVisual.replace(/\./g, '').replace(',', '.');

    const originalText = confirmBtn.innerHTML;
    confirmBtn.innerHTML = "Gerando...";
    confirmBtn.disabled = true;

    try {
        const res = await fetch("http://localhost:3000/api/gerarBoletos", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                nome, cpf, email, telefone, cep, endereco, cidade, estado,
                boletos: [{ valor, vencimento }]
            })
        });
        
        const data = await res.json();
        
        if(data.sucesso) {
            showToast("Boleto gerado com sucesso!");
            const docRef = doc(db, "clientes", clienteAtualId);
            const clienteData = clientesData.find(c => c.id === clienteAtualId);
            const novosBoletos = clienteData.boletos || [];
            const novo = data.boletos[0];
            
            novosBoletos.push({
                valor: valorVisual, 
                vencimento,
                codigo: novo.codigo,
                qrCodeUrl: novo.qrCodeUrl,
                classe: "Boleto"
            });
            
            await updateDoc(docRef, { boletos: novosBoletos });
            clienteData.boletos = novosBoletos;
            
            exibirClientes(clientesData);
            modal.style.display = "none";
            
        } else {
            showToast("Erro da API: " + JSON.stringify(data.erro));
        }
    } catch(err) {
        console.error(err);
        showToast("Erro de conexão com o servidor local.");
    } finally {
        confirmBtn.innerHTML = "Gerar Boleto";
        confirmBtn.disabled = false;
    }
};

carregarClientes();
</script>
</body>
</html>
