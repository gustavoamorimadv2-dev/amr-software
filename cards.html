ki<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visão Geral de Cards - AMR ADV</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

/* Custom Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

body {
    display:flex;
    height:100vh;
    overflow:hidden;
    background:
        radial-gradient(circle at top left,#2f3f73 0%,transparent 30%),
        radial-gradient(circle at bottom right,#0f766e 0%,transparent 25%),
        linear-gradient(135deg,#0f172a,#111827,#020617);
    color: #fff;
}

/* ================= SIDEBAR ================= */
.sidebar {
    width:80px;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 0;
    flex-shrink:0;
    transition:width 0.4s ease;
    position:relative;
    z-index:10;
    backdrop-filter:blur(30px);
    background:rgba(255,255,255,0.06);
    border-right:1px solid rgba(255,255,255,0.08);
    box-shadow:0 0 40px rgba(0,0,0,0.25);
}
.sidebar.expanded { width:240px; }
.sidebar h2 {
    font-size:22px;
    font-weight:800;
    color:#fff;
    letter-spacing:1px;
    margin-bottom:30px;
    text-align:center;
    cursor:pointer;
    width:100%;
    white-space:nowrap;
    overflow:hidden;
    transition:opacity 0.3s;
    opacity:0;
}
.sidebar.expanded h2 { opacity:1; }
.sidebar button {
    width:calc(100% - 20px);
    background:transparent;
    border:none;
    color:rgba(255,255,255,0.7);
    display:flex;
    align-items:center;
    gap:15px;
    padding:12px 15px;
    margin:5px 10px;
    cursor:pointer;
    border-radius:14px;
    transition:all 0.3s;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
}
.sidebar button img {
    width:24px;
    height:24px;
    filter:invert(1) opacity(0.7);
    flex-shrink:0;
    transition:transform 0.3s, filter 0.3s;
}
.sidebar button span { display:inline-block; opacity:0; transition:opacity 0.3s; font-weight:600; }
.sidebar.expanded button span { opacity:1; }
.sidebar button:hover img { transform:scale(1.1); filter:invert(1) opacity(1); }
.sidebar button:hover { background:rgba(255,255,255,0.1); color:#fff; }
.active-menu { background: rgba(255,255,255,0.15) !important; color: #fff !important; }

/* ================= MAIN CONTENT ================= */
.main {
    flex:1;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

header {
    height:70px;
    background:transparent;
    border-bottom:1px solid rgba(255,255,255,0.08);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 30px;
    flex-shrink:0;
}
header h1 { font-size:24px; color:#fff; font-weight:800; }

/* Barra de Filtros Refinada */
.sub-header-bar {
    padding:15px 30px;
    background:transparent;
    border-bottom:1px solid rgba(255,255,255,0.08);
    display:flex;
    align-items:center;
    gap:15px;
    flex-shrink:0;
    flex-wrap: wrap; 
}

.sub-header-bar input,
.sub-header-bar select {
    padding:10px 14px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:12px;
    color:#fff;
    font-size: 14px;
    outline: none;
    transition: 0.3s;
    backdrop-filter: blur(10px);
}
.sub-header-bar input:focus,
.sub-header-bar select:focus {
    background:rgba(255,255,255,0.15);
    border-color: rgba(255,255,255,0.3);
}
.sub-header-bar select option { background: #111827; color: #fff; }

.search-wrapper { flex: 1; min-width: 200px; }
.search-wrapper input { width: 100%; }

.btn-primary {
    padding: 10px 20px;
    border-radius: 12px;
    border: none;
    background: #3b82f6;
    color: #fff;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    transition: 0.3s;
}
.btn-primary:hover {
    background: #2563eb;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
}

.btn-green {
    padding: 10px 20px;
    border-radius: 12px;
    border: none;
    background: #10b981;
    color: #fff;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    transition: 0.3s;
    display: flex;
    align-items: center;
    gap: 8px;
}
.btn-green:hover {
    background: #059669;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
}

/* Area de Conteúdo dos Cards */
.content-area {
    flex:1;
    overflow-y:auto;
    padding:30px;
}

.grid-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
}

/* Layout do Card Individual */
.card-item {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 20px;
    transition: 0.3s;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}
.card-item:hover {
    transform: translateY(-3px);
    background: rgba(255,255,255,0.08);
    box-shadow: 0 10px 20px rgba(0,0,0,0.25);
}

.card-item h3 { font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 0; }
.card-item p { font-size: 13px; color: rgba(255,255,255,0.7); margin: 4px 0; }
.card-item p strong { color: #fff; font-weight: 600; }

.card-footer {
    margin-top: 15px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.05);
}
.badge-user {
    display: inline-block;
    font-size: 11px;
    background: rgba(168, 85, 247, 0.15);
    color: #c084fc;
    padding: 4px 10px;
    border-radius: 8px;
    border: 1px solid rgba(168, 85, 247, 0.3);
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* Botão de Copiar Telefone e Mensagem */
.btn-copy {
    background: rgba(59, 130, 246, 0.2);
    color: #60a5fa;
    border: 1px solid rgba(59, 130, 246, 0.4);
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 11px;
    cursor: pointer;
    transition: 0.2s;
    white-space: nowrap;
}
.btn-copy:hover {
    background: rgba(59, 130, 246, 0.4);
    color: #fff;
}
.btn-copy:active {
    transform: scale(0.95);
}

/* Badges para PF / PJ */
.badge-tipo {
    display: inline-block;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 8px;
    font-weight: bold;
    text-transform: uppercase;
}
.badge-pf {
    background: rgba(59, 130, 246, 0.2);
    color: #60a5fa;
    border: 1px solid rgba(59, 130, 246, 0.3);
}
.badge-pj {
    background: rgba(245, 158, 11, 0.2);
    color: #fbbf24;
    border: 1px solid rgba(245, 158, 11, 0.3);
}
.badge-indefinido {
    background: rgba(156, 163, 175, 0.2);
    color: #9ca3af;
    border: 1px solid rgba(156, 163, 175, 0.3);
}

.empty-msg {
    color: rgba(255,255,255,0.4);
    font-size: 14px;
    font-style: italic;
    text-align: center;
    margin-top: 40px;
    width: 100%;
}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyAFJJAqVf3ge0WDHBpmS9E6sXKvnjuFkhw",
    authDomain: "dapapp-38637.firebaseapp.com",
    projectId: "dapapp-38637",
    storageBucket: "dapapp-38637.firebasestorage.app",
    messagingSenderId: "628852295313",
    appId: "1:628852295313:web:1234567890abcdef123456"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

document.addEventListener('DOMContentLoaded', () => {
    const sidebar = document.querySelector(".sidebar");
    if(sidebar){
        sidebar.addEventListener('mouseenter', () => sidebar.classList.add('expanded'));
        sidebar.addEventListener('mouseleave', () => sidebar.classList.remove('expanded'));
    }

    let todosClientes = [];
    let clientesExibidos = []; 

    const filterData = document.getElementById('filterData');
    const filterEstado = document.getElementById('filterEstado');
    const filterAcao = document.getElementById('filterAcao');
    const searchInput = document.getElementById('searchInput');
    const btnFiltrar = document.getElementById('btnFiltrar');
    const btnBaixarCsv = document.getElementById('btnBaixarCsv');
    const containerCards = document.getElementById('containerCards');

    // Ao clicar em Filtrar
    btnFiltrar.onclick = () => aplicarFiltros();

    // Puxa todos os cards do banco globalmente e já remove os com status 'fechado'
    async function carregarTodosCards() {
        containerCards.innerHTML = '<p class="empty-msg">Carregando painel de cards...</p>';
        try {
            const snap = await getDocs(collection(db, "clientes"));
            const rawClientes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            // Filtra removendo permanentemente os clientes com status "fechado" da exibição
            todosClientes = rawClientes.filter(c => {
                const status = c.status ? String(c.status).toLowerCase().trim() : '';
                return status !== 'fechado';
            });
            
            // Popula os selects com dados dinâmicos
            preencherFiltrosDinamicos();

            // Renderiza tudo inicialmente
            aplicarFiltros();
        } catch (error) {
            console.error(error);
            containerCards.innerHTML = '<p class="empty-msg" style="color: #ef4444;">Erro ao carregar dados do Firebase.</p>';
        }
    }

    function preencherFiltrosDinamicos() {
        const estadosSet = new Set();
        const acoesSet = new Set();

        todosClientes.forEach(c => {
            const uf = c.estado || c.uf || '';
            const acao = c.classe || c.acao || c.tipoAcao || '';
            
            if(uf) estadosSet.add(uf.toUpperCase());
            if(acao) acoesSet.add(acao);
        });

        // Preenche Estados
        filterEstado.innerHTML = '<option value="">Todos os Estados</option>';
        Array.from(estadosSet).sort().forEach(uf => {
            const opt = document.createElement('option');
            opt.value = uf;
            opt.textContent = uf;
            filterEstado.appendChild(opt);
        });

        // Preenche Ações/Classe
        filterAcao.innerHTML = '<option value="">Todos os Tipos de Ação</option>';
        Array.from(acoesSet).sort().forEach(acao => {
            const opt = document.createElement('option');
            opt.value = acao;
            opt.textContent = acao;
            filterAcao.appendChild(opt);
        });
    }

    function aplicarFiltros() {
        const selData = filterData.value; 
        const selEstado = filterEstado.value.toUpperCase();
        const selAcao = filterAcao.value.toLowerCase();
        const txtBusca = searchInput.value.toLowerCase();

        clientesExibidos = todosClientes.filter(c => {
            // CORREÇÃO MÁXIMA NA VERIFICAÇÃO DE DATA:
            // Alinha qualquer formato (DD/MM/YYYY ou YYYY-MM-DD) para comparar sem falhas
            let matchData = true;
            if (selData) {
                if (!c.dataCadastro) {
                    matchData = false;
                } else {
                    // Normaliza a data do campo de busca do navegador
                    let buscaIso = selData;
                    if (selData.includes('/')) {
                        const pBusca = selData.split('/');
                        buscaIso = `${pBusca[2]}-${pBusca[1]}-${pBusca[0]}`;
                    }
                    
                    // Normaliza a data salva no Firebase (remove horário e trata barras perdidas)
                    let bancoIso = c.dataCadastro.split('T')[0];
                    if (bancoIso.includes('/')) {
                        const pBanco = bancoIso.split('/');
                        bancoIso = `${pBanco[2]}-${pBanco[1]}-${pBanco[0]}`;
                    }
                    
                    matchData = (bancoIso === buscaIso);
                }
            }

            // Verifica Estado
            let matchEstado = true;
            if (selEstado) {
                const uf = (c.estado || c.uf || '').toUpperCase();
                matchEstado = (uf === selEstado);
            }

            // Verifica Ação
            let matchAcao = true;
            if (selAcao) {
                const acao = (c.classe || c.acao || c.tipoAcao || '').toLowerCase();
                matchAcao = (acao === selAcao);
            }

            // Verifica Busca Livre (Nome, CPF ou Telefone)
            let matchBusca = true;
            if (txtBusca) {
                const nome = c.nome ? c.nome.toLowerCase() : '';
                const cpf = c.cpf ? c.cpf.toLowerCase() : '';
                const numeros = c.numeros ? c.numeros.toLowerCase() : '';

                // Busca pelo texto exato que o usuário digitou
                const achouTexto = nome.includes(txtBusca) || cpf.includes(txtBusca) || numeros.includes(txtBusca);

                // Busca ignorando formatações (pontos, traços, parênteses) para facilitar encontrar CPFs e Telefones
                const buscaNumerica = txtBusca.replace(/\D/g, '');
                let achouNumerico = false;
                
                if (buscaNumerica) {
                    const cpfLimpo = cpf.replace(/\D/g, '');
                    const numerosLimpos = numeros.replace(/\D/g, '');
                    achouNumerico = cpfLimpo.includes(buscaNumerica) || numerosLimpos.includes(buscaNumerica);
                }

                matchBusca = achouTexto || achouNumerico;
            }

            return matchData && matchEstado && matchAcao && matchBusca;
        });

        renderizarCards(clientesExibidos);
    }

    function renderizarCards(lista) {
        containerCards.innerHTML = '';

        if (lista.length === 0) {
            containerCards.innerHTML = '<p class="empty-msg">Nenhum card encontrado com esses filtros.</p>';
            return;
        }

        const grid = document.createElement('div');
        grid.className = 'grid-cards';
        
        lista.forEach(c => {
            grid.appendChild(criarElementoCard(c));
        });
        
        containerCards.appendChild(grid);
    }

    // Estrutura do card exibido em tela
    function criarElementoCard(cliente) {
        const div = document.createElement('div');
        div.className = 'card-item';

        const primeiroProcesso = cliente.processo ? cliente.processo.split(',')[0].trim() : '-';
        // Pega todos os números, remove espaços extras e junta com vírgula e espaço
        const todosNumeros = cliente.numeros ? cliente.numeros.split(',').map(n => n.trim()).join(', ') : '-';
        const responsavel = cliente.responsavel || cliente.criadoPor || 'Não Definido';
        const ufCard = cliente.estado || cliente.uf || '-';
        const acao = cliente.classe || cliente.acao || '-';
        
        // Lógica para diferenciar CPF vs CNPJ no card
        const documentoStr = cliente.cpf || '-';
        let tipoPessoa = 'N/A';
        let badgeClass = 'badge-indefinido';
        
        if (documentoStr !== '-') {
            const limpo = documentoStr.replace(/\D/g, '');
            if (limpo.length > 11) {
                tipoPessoa = 'PJ';
                badgeClass = 'badge-pj';
            } else if (limpo.length > 0) {
                tipoPessoa = 'PF';
                badgeClass = 'badge-pf';
            }
        }

        // --- Lógica para o Botão Copiar Mensagem ---
        let nomeParaExibir = (cliente.nome || 'Sem Nome').trim();
        let textoParaCopiar = "";

        if (tipoPessoa === 'PJ') {
            textoParaCopiar = `Bom dia, falo com o representante da empresa "${nomeParaExibir}"?`;
        } else {
            const partesNome = nomeParaExibir.split(' ');
            const primeiroNome = partesNome[0];
            let nomeFormatado = primeiroNome;
            if (primeiroNome) {
                nomeFormatado = primeiroNome.charAt(0).toUpperCase() + primeiroNome.slice(1).toLowerCase();
            }
            textoParaCopiar = `Bom dia ${nomeFormatado}`;
        }
        
        // Protege contra aspas simples e duplas para não quebrar o HTML do onclick
        const textoEscapado = textoParaCopiar.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        // -------------------------------------------

        div.innerHTML = `
            <div>
                <div style="display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px;">
                    <h3>${nomeParaExibir}</h3>
                    <button class="btn-copy" style="margin-left: 10px;" onclick="navigator.clipboard.writeText('${textoEscapado}'); this.innerText='Copiada!'; setTimeout(() => this.innerText='Copiar Mensagem', 2000);" title="Copiar mensagem inicial">Copiar Mensagem</button>
                </div>
                <p><strong>Ação:</strong> ${acao}</p>
                <p><strong>CPF/CNPJ:</strong> ${documentoStr} ${tipoPessoa !== 'N/A' ? `<span class="badge-tipo ${badgeClass}">${tipoPessoa}</span>` : ''}</p>
                <p style="display: flex; align-items: center; justify-content: space-between;">
                    <span><strong>Telefones:</strong> ${todosNumeros}</span>
                    ${todosNumeros !== '-' ? `<button class="btn-copy" onclick="navigator.clipboard.writeText('${todosNumeros}'); this.innerText='Copiado!'; setTimeout(() => this.innerText='Copiar', 2000);" title="Copiar números">Copiar</button>` : ''}
                </p>
                <p><strong>Processo:</strong> ${primeiroProcesso}</p>
                <p><strong>Estado:</strong> ${ufCard.toUpperCase()}</p>
                <p><strong>Valor:</strong> R$ ${cliente.valor || '0'}</p>
            </div>
            <div class="card-footer">
                <div class="badge-user" title="Cadastrado por / Responsável: ${responsavel}">
                    👤 Cadastrado por: ${responsavel}
                </div>
            </div>
        `;
        return div;
    }

    // Função de Baixar CSV Padrão WhatsApp Business
    btnBaixarCsv.onclick = () => {
        if (clientesExibidos.length === 0) {
            alert("A lista atual está vazia. Filtre e exiba clientes antes de baixar o CSV.");
            return;
        }

        // Adicionada a coluna "Type" no cabeçalho do CSV
        let csvContent = "Name,Phone,Type\n";

        clientesExibidos.forEach(c => {
            // Remove vírgulas do nome para não quebrar a coluna do CSV
            const nome = c.nome ? c.nome.replace(/,/g, '') : 'Sem Nome'; 
            
            // Verifica o tipo de pessoa para incluir na planilha
            let tipoPessoaCsv = 'PF'; // Padrão
            if (c.cpf) {
                const docLimpo = c.cpf.replace(/\D/g, '');
                if (docLimpo.length > 11) {
                    tipoPessoaCsv = 'PJ';
                }
            }
            
            // Verifica se existem números cadastrados
            if (c.numeros) {
                // Transforma a string de números em um array
                const arrayNumeros = c.numeros.split(',');
                
                // Faz um loop para CADA número que o cliente possuir
                arrayNumeros.forEach(numeroRaw => {
                    const numeroLimpo = numeroRaw.replace(/\D/g, ''); 

                    // Só adiciona a linha se o número for válido após a limpeza
                    if (numeroLimpo) {
                        let wppNumero = numeroLimpo;
                        // Força código do Brasil (55) caso não tenha
                        if (!wppNumero.startsWith('55') && wppNumero.length >= 10) {
                            wppNumero = '55' + wppNumero;
                        }
                        // Adiciona uma linha no CSV com as 3 colunas: Nome, Telefone, Tipo (PF/PJ)
                        csvContent += `${nome},${wppNumero},${tipoPessoaCsv}\n`;
                    }
                });
            }
        });

        // Gera o arquivo incluindo \ufeff para garantir formatação UTF-8 e ler acentos no Excel
        const blob = new Blob(['\ufeff', csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        
        // Nomeia o arquivo com a data de hoje para organização
        const hoje = new Date().toISOString().split('T')[0];
        link.setAttribute("download", `Transmissao_Comercial_${hoje}.csv`);
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    };

    // Monitoramento de Autenticação Básica
    onAuthStateChanged(auth, user => {
        if(user){
            carregarTodosCards();
        }else{
            window.location.href = "login.html";
        }
    });
});
</script>
</head>

    <h2 onclick="window.location.href='dashboard.html'">AMR ADV</h2>
    <button onclick="window.location.href='crm.html'">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/dashboard.png"/>
        <span>CRM</span>
    </button>
    <button class="active-menu" onclick="window.location.href='cards.html'">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/user-group-man-man.png"/>
        <span>Todos os Cards</span>
    </button>
    <button onclick="window.location.href='funil_geral.html'">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/filter.png"/>
        <span>Funil Geral</span>
    </button>
    <button onclick="window.location.href='adm.html'">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/manager.png"/>
        <span>Painel ADM</span>
    </button>
</div>

<div class="main">
    <header>
        <h1>Painel Global de Cards</h1>
        <div style="font-size: 14px; color: rgba(255,255,255,0.6);">
            Visualização unificada e filtro de transmissão de leads.
        </div>
    </header>

    <div class="sub-header-bar">
        
        <input type="date" id="filterData" title="Filtrar por data de cadastro" />

        <select id="filterEstado">
            <option value="">Carregando Estados...</option>
        </select>

        <select id="filterAcao">
            <option value="">Carregando Ações...</option>
        </select>

        <div class="search-wrapper">
            <input id="searchInput" placeholder="Buscar por nome, CPF/CNPJ ou telefone..." />
        </div>

        <button class="btn-primary" id="btnFiltrar">Filtrar</button>
