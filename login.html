<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - CRM AMR ADV</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; }

body {
  display:flex;
  min-height:100vh;
  background:#000;
}

/* SIDEBAR LOGIN */
.sidebar-login {
  width:400px;
  background:#1e1e2f;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:40px;
  color:#fff;
  z-index:2;
  position:relative;
}

.sidebar-login h1 {
  font-family:'Poppins', sans-serif;
  font-size:28px;
  margin-bottom:10px;
  text-align:center;
}

.sidebar-login p {
  font-size:14px;
  text-align:center;
  margin-bottom:30px;
  color:#bbb;
}

.input-group {
  display:flex;
  flex-direction:column;
  gap:15px;
}

.input-group input {
  padding:12px;
  border-radius:10px;
  border:none;
  font-size:15px;
  outline:none;
}

button {
  padding:12px;
  background:#fff;
  color:#1e1e2f;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
  transition:all 0.3s ease;
}
button:hover { background:#eaeaea; }
button:disabled { background: #ccc; cursor: not-allowed; }

.error {
  color:#ff7675;
  font-size:13px;
  display:none;
  margin-top: 5px;
  line-height: 1.4;
}

/* ÁREA DO VÍDEO */
.video-container {
  flex:1;
  position:relative;
  overflow:hidden;
}

.video-container video {
  position:absolute;
  top:50%;
  left:50%;
  min-width:100%;
  min-height:100%;
  transform:translate(-50%, -50%);
  object-fit:cover;
  filter:brightness(0.5);
}

/* TEXTO NO TOPO DO VÍDEO */
.video-overlay {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  padding:30px 0;
  text-align:center;
  z-index:2;
}

.video-overlay h2 {
  font-size:28px;
  font-family:'Poppins', sans-serif;
  font-weight:600;
  color:#fff;
  text-shadow: 0 2px 10px rgba(0,0,0,0.8);
}

.toast {
  position:fixed;
  bottom:20px;
  right:20px;
  background:#222;
  color:#fff;
  padding:12px 20px;
  border-radius:8px;
  display:none;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  z-index: 999;
}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";
import { getFirestore, doc, setDoc, collection, query, where, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAFJJAqVf3ge0WDHBpmS9E6sXKvnjuFkhw",
    authDomain: "dapapp-38637.firebaseapp.com",
    projectId: "dapapp-38637",
    storageBucket: "dapapp-38637.firebasestorage.app", 
    messagingSenderId: "628852295313",
    appId: "1:628852295313:web:1234567890abcdef123456"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("loginForm");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const errorMsg = document.getElementById("errorMsg");
  const toast = document.getElementById("toast");
  const video = document.getElementById("bgVideo");
  const btnSubmit = form.querySelector("button[type='submit']");

  video.muted = true;
  video.play().catch(() => {
    document.body.addEventListener("click", () => video.play(), { once: true });
  });

  function showToast(msg){
    toast.innerText = msg;
    toast.style.display = 'block';
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.style.display = 'none', 4000);
  }

  function resetBotao(mensagemErro = null) {
      if(mensagemErro) {
          errorMsg.innerText = mensagemErro;
          errorMsg.style.display = "block";
      }
      btnSubmit.innerText = "Entrar";
      btnSubmit.disabled = false;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorMsg.style.display = "none";
    
    // Convertendo para minúsculo para garantir a compatibilidade
    const email = emailInput.value.trim().toLowerCase();
    const senha = passwordInput.value;

    btnSubmit.innerText = "Autenticando...";
    btnSubmit.disabled = true;

    try {
      // 1. TENTA O LOGIN NORMAL
      await signInWithEmailAndPassword(auth, email, senha);
      showToast("Login realizado com sucesso!");
      setTimeout(() => window.location.href = "crm.html", 1000);

    } catch (error) {
      console.log("Falha no Auth, verificando pré-cadastro...", error.code);

      // 2. SE FALHAR, VERIFICA O PRÉ-CADASTRO
      if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
          try {
              btnSubmit.innerText = "Verificando convite...";
              
              const qPre = query(
                  collection(db, "pre_cadastros"), 
                  where("email", "==", email), 
                  where("senhaPadrao", "==", senha)
              );
              
              const preSnap = await getDocs(qPre);

              if (!preSnap.empty) {
                  const docDados = preSnap.docs[0];
                  const dadosFunc = docDados.data();

                  showToast("Configurando seu primeiro acesso...");
                  btnSubmit.innerText = "Criando conta...";

                  const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
                  const novoUid = userCredential.user.uid;

                  await setDoc(doc(db, "funcionarios", novoUid), {
                      nome: dadosFunc.nome || "Usuário",
                      email: email,
                      criadoEm: new Date().toISOString()
                  });

                  await deleteDoc(doc(db, "pre_cadastros", docDados.id));

                  showToast("Tudo pronto! Redirecionando...");
                  setTimeout(() => window.location.href = "crm.html", 1500);
              } else {
                  // Pré-cadastro realmente não existe ou a senha não bate
                  resetBotao("E-mail ou senha inválidos. O cadastro não foi encontrado no sistema.");
              }
          } catch (errDb) {
              console.error("Erro no fluxo do primeiro acesso: ", errDb);
              // Verifica se é erro de permissão do Firestore
              if(errDb.code === 'permission-denied') {
                  resetBotao("Erro de Segurança: O banco de dados bloqueou a verificação do pré-cadastro. Ajuste as regras do Firestore.");
              } else {
                  resetBotao("Erro de conexão ao buscar o cadastro. Tente novamente.");
              }
          }
      } else {
          // Outros erros (ex: muitas tentativas, bloqueado)
          resetBotao("Erro no login: " + error.message);
      }
    }
  });
});
</script>
</head>
<body>
  <div class="sidebar-login">
    <h1>AMR ADV</h1>
    <p>Bem-vindo ao seu CRM. Faça login para continuar.</p>
    <form id="loginForm" class="input-group">
      <input type="email" id="email" placeholder="E-mail" required />
      <input type="password" id="password" placeholder="Senha" required />
      <span id="errorMsg" class="error"></span>
      <button type="submit">Entrar</button>
    </form>
  </div>

  <div class="video-container">
    <video id="bgVideo" autoplay muted loop playsinline>
      <source src="videotrem.mp4" type="video/mp4">
      Seu navegador não suporta vídeo.
    </video>
    <div class="video-overlay">
      <h2>Gerencie sua advocacia de forma inteligente</h2>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</body>
</html>
