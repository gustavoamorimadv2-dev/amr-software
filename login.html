<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - CRM AMR ADV</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; }

body {
  display:flex;
  min-height:100vh;
  background:#000;
}

/* SIDEBAR LOGIN */
.sidebar-login {
  width:400px;
  background:#1e1e2f;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:40px;
  color:#fff;
  z-index:2;
  position:relative;
}

.sidebar-login h1 {
  font-family:'Poppins', sans-serif;
  font-size:28px;
  margin-bottom:10px;
  text-align:center;
}

.sidebar-login p {
  font-size:14px;
  text-align:center;
  margin-bottom:30px;
  color:#bbb;
}

.input-group {
  display:flex;
  flex-direction:column;
  gap:15px;
}

.input-group input {
  padding:12px;
  border-radius:10px;
  border:none;
  font-size:15px;
  outline:none;
}

button {
  padding:12px;
  background:#fff;
  color:#1e1e2f;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
  transition:all 0.3s ease;
}
button:hover { background:#eaeaea; }
button:disabled { background: #ccc; cursor: not-allowed; }

.error {
  color:#ff7675;
  font-size:13px;
  display:none;
  margin-top: 5px;
  line-height: 1.4;
}

/* ÁREA DO VÍDEO */
.video-container {
  flex:1;
  position:relative;
  overflow:hidden;
}

.video-container video {
  position:absolute;
  top:50%;
  left:50%;
  min-width:100%;
  min-height:100%;
  transform:translate(-50%, -50%);
  object-fit:cover;
  filter:brightness(0.5);
}

/* TEXTO NO TOPO DO VÍDEO */
.video-overlay {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  padding:30px 0;
  text-align:center;
  z-index:2;
}

.video-overlay h2 {
  font-size:28px;
  font-family:'Poppins', sans-serif;
  font-weight:600;
  color:#fff;
  text-shadow: 0 2px 10px rgba(0,0,0,0.8);
}

.toast {
  position:fixed;
  bottom:20px;
  right:20px;
  background:#222;
  color:#fff;
  padding:12px 20px;
  border-radius:8px;
  display:none;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  z-index: 999;
}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";
import {
  getFirestore,
  doc,
  setDoc,
  collection,
  query,
  where,
  getDocs,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

/* =========================================================
   ESCRITÓRIO 1 - CONFIGURAÇÃO ATUAL
   Mantém exatamente o Firebase que a página já utilizava.
   ========================================================= */
const firebaseConfigEscritorio1 = {
  apiKey: "AIzaSyAFJJAqVf3ge0WDHBpmS9E6sXKvnjuFkhw",
  authDomain: "dapapp-38637.firebaseapp.com",
  projectId: "dapapp-38637",
  storageBucket: "dapapp-38637.firebasestorage.app",
  messagingSenderId: "628852295313",
  appId: "1:628852295313:web:1234567890abcdef123456"
};

/* =========================================================
   ESCRITÓRIO 2 - RSW CONSULTORIA
   Auth do novo projeto usado pelo CRM rodriguesamorim.html.
   ========================================================= */
const firebaseConfigEscritorio2 = {
  apiKey: "AIzaSyAVaWq65gTmrMH99a4QJHs8I8DoSpQbvFo",
  authDomain: "rsw-consultoria.firebaseapp.com",
  projectId: "rsw-consultoria",
  storageBucket: "rsw-consultoria.firebasestorage.app",
  messagingSenderId: "872728271248",
  appId: "1:872728271248:web:d67949ed4fd7d1c0d87b15",
  measurementId: "G-R9H446B3BX"
};

// Dois apps Firebase independentes na mesma página.
const appEscritorio1 = initializeApp(firebaseConfigEscritorio1, "escritorio1");
const appEscritorio2 = initializeApp(firebaseConfigEscritorio2, "escritorio2");

const authEscritorio1 = getAuth(appEscritorio1);
const authEscritorio2 = getAuth(appEscritorio2);

// O banco abaixo continua sendo o banco do Escritório 1 para preservar
// o fluxo já existente de pré-cadastro/convites dessa página.
const dbEscritorio1 = getFirestore(appEscritorio1);

const EMAIL_ADMIN_MESTRE = "gruponascimentoesouza@gmail.com";

function isErroCredencial(error) {
  const code = (error?.code || "").toLowerCase();
  const message = (error?.message || "").toLowerCase();

  return (
    code.includes("invalid-credential") ||
    code.includes("invalid-login-credentials") ||
    code.includes("user-not-found") ||
    code.includes("wrong-password") ||
    message.includes("invalid-credential") ||
    message.includes("invalid-login-credentials")
  );
}

function destinoEscritorio1(email) {
  if ((email || "").toLowerCase() === EMAIL_ADMIN_MESTRE) {
    return "adm.html";
  }
  return "index.html";
}

function destinoEscritorio2() {
  return "rodriguesamorim.html";
}

async function encerrarOutroAuth(auth) {
  try {
    if (auth.currentUser) {
      await signOut(auth);
    }
  } catch (e) {
    console.warn("Não foi possível limpar a outra sessão Firebase:", e);
  }
}

/* =========================================================
   AUTO-REDIRECIONAMENTO
   Se o usuário já estiver logado em algum dos dois projetos,
   a página reconhece a sessão e manda para o CRM correto.
   Escritório 1 tem prioridade se houver duas sessões antigas.
   ========================================================= */
let estadoInicial1Resolvido = false;
let estadoInicial2Resolvido = false;
let usuarioInicial1 = null;
let usuarioInicial2 = null;
let redirecionamentoInicialExecutado = false;

function verificarSessaoInicial() {
  if (redirecionamentoInicialExecutado) return;
  if (!estadoInicial1Resolvido || !estadoInicial2Resolvido) return;

  if (usuarioInicial1) {
    redirecionamentoInicialExecutado = true;
    const email = (usuarioInicial1.email || "").toLowerCase();
    window.location.replace(destinoEscritorio1(email));
    return;
  }

  if (usuarioInicial2) {
    redirecionamentoInicialExecutado = true;
    window.location.replace(destinoEscritorio2());
  }
}

const unsubscribeInicial1 = onAuthStateChanged(authEscritorio1, (user) => {
  usuarioInicial1 = user;
  estadoInicial1Resolvido = true;
  verificarSessaoInicial();
  unsubscribeInicial1();
});

const unsubscribeInicial2 = onAuthStateChanged(authEscritorio2, (user) => {
  usuarioInicial2 = user;
  estadoInicial2Resolvido = true;
  verificarSessaoInicial();
  unsubscribeInicial2();
});

document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("loginForm");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const errorMsg = document.getElementById("errorMsg");
  const toast = document.getElementById("toast");
  const video = document.getElementById("bgVideo");
  const btnSubmit = form.querySelector("button[type='submit']");

  video.muted = true;
  video.play().catch(() => {
    document.body.addEventListener("click", () => video.play(), { once: true });
  });

  function showToast(msg){
    toast.innerText = msg;
    toast.style.display = 'block';
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.style.display = 'none', 4000);
  }

  function resetBotao(mensagemErro = null) {
    if(mensagemErro) {
      errorMsg.innerText = mensagemErro;
      errorMsg.style.display = "block";
    }
    btnSubmit.innerText = "Entrar";
    btnSubmit.disabled = false;
  }

  async function loginNoEscritorio1(email, senha) {
    try {
      const credencial = await signInWithEmailAndPassword(authEscritorio1, email, senha);
      await encerrarOutroAuth(authEscritorio2);
      return { sucesso: true, user: credencial.user };
    } catch (error) {
      return { sucesso: false, error };
    }
  }

  async function loginNoEscritorio2(email, senha) {
    try {
      const credencial = await signInWithEmailAndPassword(authEscritorio2, email, senha);
      await encerrarOutroAuth(authEscritorio1);
      return { sucesso: true, user: credencial.user };
    } catch (error) {
      return { sucesso: false, error };
    }
  }

  async function tentarFluxoConviteEscritorio1(email, senha) {
    try {
      btnSubmit.innerText = "Verificando convite...";

      const qPre = query(
        collection(dbEscritorio1, "pre_cadastros"),
        where("email", "==", email),
        where("senhaPadrao", "==", senha)
      );

      const preSnap = await getDocs(qPre);

      if (preSnap.empty) {
        return { sucesso: false, motivo: "sem-convite" };
      }

      const docDados = preSnap.docs[0];
      const dadosFunc = docDados.data();

      showToast("Configurando seu primeiro acesso...");
      btnSubmit.innerText = "Criando conta...";

      const userCredential = await createUserWithEmailAndPassword(authEscritorio1, email, senha);
      const novoUid = userCredential.user.uid;

      await setDoc(doc(dbEscritorio1, "funcionarios", novoUid), {
        nome: dadosFunc.nome || "Usuário",
        email: email,
        criadoEm: new Date().toISOString()
      });

      await deleteDoc(doc(dbEscritorio1, "pre_cadastros", docDados.id));
      await encerrarOutroAuth(authEscritorio2);

      return { sucesso: true, user: userCredential.user };

    } catch (error) {
      return { sucesso: false, error, motivo: "erro" };
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorMsg.style.display = "none";

    const email = emailInput.value.trim().toLowerCase();
    const senha = passwordInput.value;

    btnSubmit.innerText = "Autenticando...";
    btnSubmit.disabled = true;

    // =====================================================
    // 1) PRIMEIRO TENTA O AUTH DO ESCRITÓRIO 1
    // =====================================================
    const tentativa1 = await loginNoEscritorio1(email, senha);

    if (tentativa1.sucesso) {
      showToast("Login realizado com sucesso!");
      setTimeout(() => {
        window.location.replace(destinoEscritorio1(email));
      }, 700);
      return;
    }

    // Se foi um erro diferente de credencial, ainda tentamos o segundo Auth.
    console.log("Escritório 1 não autenticou:", tentativa1.error);

    // =====================================================
    // 2) SE NÃO ACHOU NO PRIMEIRO, TENTA RSW-CONSULTORIA
    // =====================================================
    btnSubmit.innerText = "Verificando segundo escritório...";
    const tentativa2 = await loginNoEscritorio2(email, senha);

    if (tentativa2.sucesso) {
      showToast("Login realizado com sucesso!");
      setTimeout(() => {
        window.location.replace(destinoEscritorio2());
      }, 700);
      return;
    }

    console.log("Escritório 2 não autenticou:", tentativa2.error);

    // =====================================================
    // 3) MANTÉM O FLUXO ANTIGO DO ADMIN MESTRE
    //    SOMENTE NO ESCRITÓRIO 1
    // =====================================================
    if (email === EMAIL_ADMIN_MESTRE && isErroCredencial(tentativa1.error)) {
      try {
        btnSubmit.innerText = "Criando conta Admin...";

        const userCredential = await createUserWithEmailAndPassword(
          authEscritorio1,
          email,
          senha
        );

        const novoUid = userCredential.user.uid;

        await setDoc(doc(dbEscritorio1, "funcionarios", novoUid), {
          nome: "Administrador Mestre",
          email: email,
          criadoEm: new Date().toISOString()
        });

        await encerrarOutroAuth(authEscritorio2);
        showToast("Conta Mestre configurada! Redirecionando...");
        setTimeout(() => window.location.replace("adm.html"), 1200);
        return;

      } catch (adminErr) {
        if (adminErr.code === 'auth/email-already-in-use') {
          resetBotao("Senha incorreta para o Administrador.");
        } else {
          resetBotao("Erro ao configurar Admin: " + adminErr.message);
        }
        return;
      }
    }

    // =====================================================
    // 4) PRESERVA O FLUXO ANTIGO DE CONVITES DO ESCRITÓRIO 1
    //    Só roda quando os dois Auths recusaram a credencial.
    // =====================================================
    if (isErroCredencial(tentativa1.error) && isErroCredencial(tentativa2.error)) {
      const convite = await tentarFluxoConviteEscritorio1(email, senha);

      if (convite.sucesso) {
        showToast("Tudo pronto! Redirecionando...");
        setTimeout(() => window.location.replace("index.html"), 1200);
        return;
      }

      if (convite.error?.code === 'permission-denied') {
        resetBotao("As regras de banco de dados do Firebase bloquearam a criação da conta. Avise o Administrador.");
        return;
      }

      if (convite.motivo === "erro" && convite.error) {
        console.error("Erro no fluxo de convite:", convite.error);
      }

      resetBotao("E-mail ou senha inválidos nos dois escritórios.");
      return;
    }

    // Se um dos projetos respondeu com erro técnico, mostramos uma mensagem genérica.
    const erroTecnico = !isErroCredencial(tentativa1.error)
      ? tentativa1.error
      : tentativa2.error;

    resetBotao("Erro no acesso: " + (erroTecnico?.message || "Não foi possível autenticar."));
  });
});
</script>
</head>
<body>
  <div class="sidebar-login">
    <h1>AMR ADV</h1>
    <p>Bem-vindo ao seu CRM. Faça login para continuar.</p>
    <form id="loginForm" class="input-group">
      <input type="email" id="email" placeholder="E-mail" required />
      <input type="password" id="password" placeholder="Senha" required />
      <span id="errorMsg" class="error"></span>
      <button type="submit">Entrar</button>
    </form>
  </div>

  <div class="video-container">
    <video id="bgVideo" autoplay muted loop playsinline>
      <source src="videotrem.mp4" type="video/mp4">
      Seu navegador não suporta vídeo.
    </video>
    <div class="video-overlay">
      <h2>Gerencie sua advocacia de forma inteligente</h2>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</body>
</html>
