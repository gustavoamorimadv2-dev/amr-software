<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funil Geral - Escritório</title>
    <!-- Utilizando Tailwind CSS para estilização rápida e moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos adicionais para transições suaves */
        .card-hover { transition: transform 0.2s, box-shadow 0.2s; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-8">

    <div class="max-w-7xl mx-auto">
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">Funil Geral do Escritório</h1>
                <p class="text-gray-500 mt-1">Cards disponíveis para resgate após 5 dias de inatividade.</p>
            </div>
            <!-- Simulação de usuário logado -->
            <div class="bg-white px-4 py-2 rounded shadow-sm text-sm font-medium text-gray-700">
                👤 Logado como: <span id="currentUser" class="text-blue-600">João Silva</span>
            </div>
        </header>

        <!-- Container onde os cards serão renderizados via JavaScript -->
        <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Os cards entrarão aqui -->
        </div>
    </div>

    <script>
        // Usuário atual simulado (quem está clicando em "Resgatar")
        const usuarioLogado = "João Silva";

        // Gerar datas para simulação
        const hoje = new Date();
        const dataOntem = new Date(hoje); dataOntem.setDate(hoje.getDate() - 1);
        const dataAntiga = new Date(hoje); dataAntiga.setDate(hoje.getDate() - 6);
        const dataMuitoAntiga = new Date(hoje); dataMuitoAntiga.setDate(hoje.getDate() - 10);

        // Banco de dados simulado dos clientes
        let clientes = [
            {
                id: 1,
                nome: "Carlos Eduardo Oliveira",
                telefone: "(11) 98765-4321",
                email: "carlos.edu@email.com",
                servico: "Consultoria Financeira",
                dataUltimoResgate: dataAntiga.toISOString(), // Mais de 5 dias
                responsavel: "Maria Souza"
            },
            {
                id: 2,
                nome: "Ana Pereira Santos",
                telefone: "(21) 99999-1111",
                email: "ana.pereira@email.com",
                servico: "Assessoria Jurídica",
                dataUltimoResgate: dataOntem.toISOString(), // Menos de 5 dias (Bloqueado)
                responsavel: "Pedro Alves"
            },
            {
                id: 3,
                nome: "Roberto Mendes",
                telefone: "(31) 97777-2222",
                email: "roberto.mendes@email.com",
                servico: "Planejamento Tributário",
                dataUltimoResgate: dataMuitoAntiga.toISOString(), // Mais de 5 dias
                responsavel: "João Silva"
            },
            {
                id: 4,
                nome: "Empresa XPTO Ltda",
                telefone: "(41) 3333-4444",
                email: "contato@xpto.com.br",
                servico: "Auditoria Contábil",
                dataUltimoResgate: hoje.toISOString(), // Novo cadastro/resgate
                responsavel: "Marcos Fernandes"
            }
        ];

        // Função para calcular a diferença em dias entre duas datas
        function calcularDiferencaDias(dataInicio, dataFim) {
            const data1 = new Date(dataInicio);
            const data2 = new Date(dataFim);
            const diffTempo = Math.abs(data2 - data1);
            return Math.floor(diffTempo / (1000 * 60 * 60 * 24));
        }

        // Função para formatar data (DD/MM/AAAA)
        function formatarData(dataISO) {
            const data = new Date(dataISO);
            return data.toLocaleDateString('pt-BR');
        }

        // Função principal para renderizar os cards na tela
        function renderizarCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = ''; // Limpa o container

            clientes.forEach(cliente => {
                const diasPassados = calcularDiferencaDias(cliente.dataUltimoResgate, new Date());
                const disponivel = diasPassados >= 5;

                // Definir cores e textos com base na disponibilidade
                const corBorda = disponivel ? 'border-green-500' : 'border-red-500';
                const corBadge = disponivel ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800';
                const textoStatus = disponivel ? 'Disponível para Resgate' : 'Em posse de um colaborador';
                const iconeStatus = disponivel ? '🟢' : '🔴';

                // Construção do HTML do card
                const cardHTML = `
                    <div class="bg-white rounded-lg shadow-sm border-t-4 ${corBorda} card-hover flex flex-col h-full">
                        <!-- Cabeçalho do Card -->
                        <div class="p-5 border-b border-gray-100 flex-grow">
                            <div class="flex justify-between items-start mb-4">
                                <h2 class="text-lg font-semibold text-gray-800 truncate" title="${cliente.nome}">${cliente.nome}</h2>
                                <span class="text-xs font-semibold px-2.5 py-0.5 rounded ${corBadge} whitespace-nowrap">
                                    ${iconeStatus} ${textoStatus}
                                </span>
                            </div>
                            
                            <!-- Informações do Cliente -->
                            <div class="space-y-2 text-sm text-gray-600">
                                <p class="flex items-center">
                                    <span class="mr-2">📞</span> ${cliente.telefone}
                                </p>
                                <p class="flex items-center">
                                    <span class="mr-2">✉️</span> <span class="truncate" title="${cliente.email}">${cliente.email}</span>
                                </p>
                                <p class="flex items-center">
                                    <span class="mr-2">💼</span> ${cliente.servico}
                                </p>
                                <p class="flex items-center mt-4 text-xs text-gray-400">
                                    ⏱️ Última ação: ${formatarData(cliente.dataUltimoResgate)} (${diasPassados} dias atrás)
                                </p>
                            </div>
                        </div>

                        <!-- Rodapé do Card: Responsável e Ação -->
                        <div class="bg-gray-50 p-4 rounded-b-lg flex flex-col sm:flex-row justify-between items-center gap-3">
                            <div class="text-sm">
                                <span class="text-gray-500">Responsável atual:</span><br>
                                <span class="font-semibold text-gray-700">${cliente.responsavel || 'Nenhum'}</span>
                            </div>
                            
                            <button 
                                onclick="resgatarCard(${cliente.id})" 
                                ${!disponivel ? 'disabled' : ''}
                                class="w-full sm:w-auto px-4 py-2 rounded font-medium text-sm transition-colors
                                ${disponivel 
                                    ? 'bg-green-600 text-white hover:bg-green-700 cursor-pointer' 
                                    : 'bg-gray-300 text-gray-500 cursor-not-allowed'}"
                            >
                                ${disponivel ? 'Resgatar Card' : 'Indisponível'}
                            </button>
                        </div>
                    </div>
                `;
                
                container.innerHTML += cardHTML;
            });
        }

        // Função ativada ao clicar no botão "Resgatar Card"
        window.resgatarCard = function(id) {
            // Encontra o cliente no array
            const index = clientes.findIndex(c => c.id === id);
            
            if (index !== -1) {
                // Atualiza o responsável e a data para o momento atual
                clientes[index].responsavel = usuarioLogado;
                clientes[index].dataUltimoResgate = new Date().toISOString();
                
                // Re-renderiza a tela para mostrar a atualização
                renderizarCards();
            }
        };

        // Renderiza os cards assim que a página carrega
        document.addEventListener('DOMContentLoaded', renderizarCards);

    </script>
</body>
</html>
