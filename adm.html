<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel ADM - AMR ADV</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Biblioteca para os Gráficos -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

body {
    display:flex;
    height:100vh;
    overflow:hidden;
    background: radial-gradient(circle at top left,#2f3f73 0%,transparent 30%),
                radial-gradient(circle at bottom right,#0f766e 0%,transparent 25%),
                linear-gradient(135deg,#0f172a,#111827,#020617);
    color: #fff;
}

/* SIDEBAR PADRÃO */
.sidebar{ width:80px; display:flex; flex-direction:column; align-items:center; padding:20px 0; flex-shrink:0; transition:width 0.4s ease; position:relative; z-index:10; backdrop-filter:blur(30px); background:rgba(255,255,255,0.06); border-right:1px solid rgba(255,255,255,0.08); box-shadow:0 0 40px rgba(0,0,0,0.25); }
.sidebar.expanded{ width:240px; }
.sidebar h2{ font-size:22px; font-weight:800; color:#fff; letter-spacing:1px; margin-bottom:30px; text-align:center; cursor:pointer; width:100%; white-space:nowrap; overflow:hidden; transition:opacity 0.3s; opacity:0; }
.sidebar.expanded h2{ opacity:1; }
.sidebar button{ width:calc(100% - 20px); background:transparent; border:none; color:rgba(255,255,255,0.7); display:flex; align-items:center; gap:15px; padding:12px 15px; margin:5px 10px; cursor:pointer; border-radius:14px; transition:all 0.3s; font-size:14px; white-space:nowrap; overflow:hidden; }
.sidebar button img{ width:24px; height:24px; filter:invert(1) opacity(0.7); flex-shrink:0; transition:transform 0.3s, filter 0.3s; }
.sidebar button span{ display:inline-block; opacity:0; transition:opacity 0.3s; font-weight:600; }
.sidebar.expanded button span{ opacity:1; }
.sidebar button:hover img{ transform:scale(1.1); filter:invert(1) opacity(1); }
.sidebar button:hover{ background:rgba(255,255,255,0.1); color:#fff; }
.active-menu { background: rgba(255,255,255,0.15) !important; color: #fff !important; }

/* MAIN E DASHBOARD ADM */
.main{ flex:1; display:flex; flex-direction:column; overflow:hidden; }
header{ height:70px; background:transparent; border-bottom:1px solid rgba(255,255,255,0.08); display:flex; justify-content:space-between; align-items:center; padding:0 30px; flex-shrink:0; }
header h1{ font-size:24px; color:#fff; font-weight:800; }

.content-area { padding: 30px; overflow-y: auto; flex: 1; }

.adm-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
.adm-header h2 { font-size: 20px; font-weight: 600; }

.grid-funcionarios {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
}

.func-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 20px;
    transition: 0.3s;
    display: flex;
    flex-direction: column;
    cursor: pointer;
}
.func-card:hover { transform: translateY(-3px); background: rgba(255,255,255,0.08); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
.func-card h3 { font-size: 18px; margin-bottom: 2px; color: #fff; }
.func-card p.email { font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 15px; }
.func-card p.cargo { font-size: 12px; color: #6ee7b7; font-weight: 600; margin-bottom: 5px; text-transform: uppercase; }

.stat-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-top: 1px solid rgba(255,255,255,0.05);
    font-size: 13px;
}
.stat-row span { color: rgba(255,255,255,0.7); }
.stat-row strong { color: #fff; font-weight: 700; }
.highlight-green { color: #10b981 !important; }
.highlight-blue { color: #3b82f6 !important; }
.highlight-purple { color: #a855f7 !important; }

/* TAREFAS */
.tarefas-container {
    margin-top: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.tarefa-item {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.tarefa-info h4 { font-size: 15px; color: #fff; margin-bottom: 4px; }
.tarefa-info p { font-size: 12px; color: rgba(255,255,255,0.6); }
.tarefa-status {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
}
.status-pendente { background: rgba(245, 158, 11, 0.2); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.3); }
.status-concluida { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }

/* MODAL E BOTÕES */
.btn { padding:10px 18px; border-radius:12px; border:0; cursor:pointer; font-weight: 600; font-size: 14px; transition: 0.3s; z-index: 2; position: relative;}
.btn-primary { background:#fff; color:#111827; }
.btn-primary:hover { box-shadow: 0 5px 15px rgba(255,255,255,0.2); transform: translateY(-2px); }
.btn-ghost { background:rgba(255,255,255,0.12); color:#fff; }
.btn-ghost:hover { background:rgba(255,255,255,0.2); }
.btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 8px 14px; }
.btn-outline:hover { background: rgba(255,255,255,0.1); }

.modal-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter: blur(8px); justify-content:center; align-items:center; z-index:50; }
.modal { background:#0f172a; border: 1px solid rgba(255,255,255,0.1); padding:24px; border-radius:24px; min-width:320px; max-width:450px; width:100%; box-shadow:0 20px 50px rgba(0,0,0,0.5); max-height: 90vh; overflow-y: auto;}
.modal.modal-large { max-width: 800px; } /* Modal maior para os gráficos */
.modal h3 { margin-bottom:5px; font-size: 20px; }
.modal .subtitle { font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 20px; }
.row { margin-bottom:14px; }

/* CSS do SELECT ADICIONADO AQUI */
.modal input, .modal textarea, .modal select { width:100%; padding:12px 16px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1); border-radius:12px; color:#fff; font-size: 14px; outline: none; }
.modal select option { background: #0f172a; color: #fff; }

.modal textarea { min-height: 80px; resize: vertical; }
.modal input:focus, .modal textarea:focus, .modal select:focus { background:rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }
.actions { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }

.toast { position:fixed; right:30px; bottom:30px; background:rgba(255,255,255,0.1); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); color:#fff; padding:12px 20px; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.4); display:none; z-index:60; font-weight: 500; }

.charts-container { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 20px; }
.chart-box { flex: 1; min-width: 300px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); padding: 15px; border-radius: 16px; }
</style>

<script type="module">
// ADICIONADO: "getDoc" nas importações para consultar o cargo no banco de dados.
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import { getFirestore, collection, getDocs, setDoc, doc, getDoc, addDoc, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyAFJJAqVf3ge0WDHBpmS9E6sXKvnjuFkhw",
    authDomain: "dapapp-38637.firebaseapp.com",
    projectId: "dapapp-38637",
    storageBucket: "dapapp-38637.firebasestorage.app",
    messagingSenderId: "628852295313",
    appId: "1:628852295313:web:1234567890abcdef123456"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

document.addEventListener('DOMContentLoaded', () => {
    
    const sidebar = document.querySelector(".sidebar");
    if(sidebar){
        sidebar.addEventListener('mouseenter', () => sidebar.classList.add('expanded'));
        sidebar.addEventListener('mouseleave', () => sidebar.classList.remove('expanded'));
    }

    const toastEl = document.getElementById('toast');
    function showToast(msg){
        toastEl.innerText = msg;
        toastEl.style.display = 'block';
        clearTimeout(toastEl._t);
        toastEl._t = setTimeout(() => { toastEl.style.display = 'none'; }, 3000);
    }

    let currentUser = null;
    let mapaFuncionarios = {}; 
    window.todosClientes = []; 
    let chartEstadoInstancia = null;
    let chartAcaoInstancia = null;

    // Elementos
    const gridFuncionarios = document.getElementById('gridFuncionarios');
    const modalFunc = document.getElementById('modalFuncionario');
    const modalRelatorio = document.getElementById('modalRelatorio');
    const btnNovo = document.getElementById('btnNovoFuncionario');
    const btnCancelFunc = document.getElementById('btnCancelFunc');
    const btnFecharRelatorio = document.getElementById('btnFecharRelatorio');
    const formFunc = document.getElementById('formFuncionario');

    // Elementos Tarefas
    const listaTarefas = document.getElementById('listaTarefas');
    const modalTarefa = document.getElementById('modalTarefa');
    const formTarefa = document.getElementById('formTarefa');
    const btnCancelTarefa = document.getElementById('btnCancelTarefa');
    const subtituloTarefa = document.getElementById('subtituloTarefa');
    const inputTarefaFuncId = document.getElementById('inputTarefaFuncId');

    // Abre Modais
    if(btnNovo) {
        btnNovo.onclick = () => {
            formFunc.reset();
            modalFunc.style.display = 'flex';
        }
    }
    if(btnCancelFunc) {
        btnCancelFunc.onclick = () => modalFunc.style.display = 'none';
    }
    if(btnFecharRelatorio) {
        btnFecharRelatorio.onclick = () => modalRelatorio.style.display = 'none';
    }

    window.abrirModalTarefa = (event, funcId, funcNome) => {
        event.stopPropagation(); 
        formTarefa.reset();
        inputTarefaFuncId.value = funcId;
        subtituloTarefa.innerText = `Delegar para: ${funcNome}`;
        const hoje = new Date().toISOString().split('T')[0];
        document.getElementById('inputTarefaPrazo').min = hoje;
        modalTarefa.style.display = 'flex';
    };

    if(btnCancelTarefa) {
        btnCancelTarefa.onclick = () => modalTarefa.style.display = 'none';
    }

    window.abrirRelatorio = (funcId, funcNome) => {
        document.getElementById('nomeFuncRelatorio').innerText = `Desempenho: ${funcNome}`;
        modalRelatorio.style.display = 'flex';

        const clientesDoFunc = window.todosClientes.filter(c => c.userId === funcId);

        const contagemEstados = {};
        const contagemAcoes = {};

        clientesDoFunc.forEach(c => {
            const estado = c.estado || c.uf || 'Não Informado';
            const acao = c.acao || c.tipoAcao || 'Outros';

            contagemEstados[estado] = (contagemEstados[estado] || 0) + 1;
            contagemAcoes[acao] = (contagemAcoes[acao] || 0) + 1;
        });

        renderizarGraficos(contagemEstados, contagemAcoes);
    };

    function renderizarGraficos(dadosEstados, dadosAcoes) {
        const ctxEstado = document.getElementById('chartEstados').getContext('2d');
        const ctxAcao = document.getElementById('chartAcoes').getContext('2d');

        if(chartEstadoInstancia) chartEstadoInstancia.destroy();
        if(chartAcaoInstancia) chartAcaoInstancia.destroy();

        Chart.defaults.color = 'rgba(255, 255, 255, 0.7)';
        Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.1)';

        chartEstadoInstancia = new Chart(ctxEstado, {
            type: 'doughnut',
            data: {
                labels: Object.keys(dadosEstados),
                datasets: [{
                    data: Object.values(dadosEstados),
                    backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'right' },
                    title: { display: true, text: 'Clientes por Estado', color: '#fff', font: { size: 16 } }
                }
            }
        });

        chartAcaoInstancia = new Chart(ctxAcao, {
            type: 'bar',
            data: {
                labels: Object.keys(dadosAcoes),
                datasets: [{
                    label: 'Quantidade',
                    data: Object.values(dadosAcoes),
                    backgroundColor: '#8b5cf6',
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false },
                    title: { display: true, text: 'Tipos de Ação', color: '#fff', font: { size: 16 } }
                },
                scales: {
                    y: { beginAtZero: true, ticks: { stepSize: 1 } }
                }
            }
        });
    }

    async function carregarDashboard() {
        if(!gridFuncionarios) return;
        gridFuncionarios.innerHTML = '<p style="color: rgba(255,255,255,0.5);">Carregando dados da equipe...</p>';

        try {
            const funcSnap = await getDocs(collection(db, "funcionarios"));
            const funcionariosAtivos = funcSnap.docs.map(d => ({ id: d.id, statusConta: 'Ativo', ...d.data() }));

            const preSnap = await getDocs(collection(db, "pre_cadastros"));
            const preCadastros = preSnap.docs.map(d => ({ id: d.id, statusConta: 'Aguardando 1º Acesso', ...d.data() }));

            const todosFuncionarios = [...funcionariosAtivos, ...preCadastros];

            const clientesSnap = await getDocs(collection(db, "clientes"));
            window.todosClientes = clientesSnap.docs.map(d => d.data());

            const hojeDate = new Date();
            const dataHojeStr = hojeDate.toISOString().split('T')[0];
            const hojeLocalStr = hojeDate.toLocaleDateString('pt-BR'); // Para capturar os chamados do dia no mesmo padrão do CRM

            const dataSemanaAtras = new Date();
            dataSemanaAtras.setDate(dataSemanaAtras.getDate() - 7);

            gridFuncionarios.innerHTML = '';
            mapaFuncionarios = {};

            if (todosFuncionarios.length === 0) {
                gridFuncionarios.innerHTML = '<p style="color: rgba(255,255,255,0.5);">Nenhum funcionário cadastrado ainda.</p>';
            } else {
                todosFuncionarios.forEach(func => {
                    mapaFuncionarios[func.id] = func.nome;

                    const clientesDoFunc = window.todosClientes.filter(c => c.userId === func.id);
                    
                    const cadastrosHoje = clientesDoFunc.filter(c => c.dataCadastro && c.dataCadastro.startsWith(dataHojeStr)).length;
                    
                    // NOVA LÓGICA: Calcula quantos cards do funcionário foram chamados para o Dia 1 na data de hoje
                    const chamadosHoje = clientesDoFunc.filter(c => {
                        if (!c.dataPipeline || c.status !== 'dia-1') return false;
                        const pipelineDateStr = new Date(c.dataPipeline).toLocaleDateString('pt-BR');
                        return pipelineDateStr === hojeLocalStr;
                    }).length;
                    
                    const cadastrosSemana = clientesDoFunc.filter(c => {
                        if(!c.dataCadastro) return false;
                        return new Date(c.dataCadastro) >= dataSemanaAtras;
                    }).length;

                    const naListaFria = clientesDoFunc.filter(c => c.status === 'lista-fria').length;
                    const fechados = clientesDoFunc.filter(c => c.status === 'fechado').length;
                    
                    // CARGO: Pega o cargo do banco ou diz que é vendedor por padrão se for antigo
                    const cargoExibicao = func.cargo ? func.cargo : 'Vendedor';

                    const card = document.createElement('div');
                    card.className = 'func-card';
                    card.setAttribute('onclick', `window.abrirRelatorio('${func.id}', '${func.nome}')`);
                    
                    const corStatus = func.statusConta === 'Ativo' ? '#10b981' : '#f59e0b';

                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                            <div>
                                <h3>${func.nome}</h3>
                                <p class="cargo">${cargoExibicao}</p>
                            </div>
                            <span style="font-size:10px; background:${corStatus}20; color:${corStatus}; border:1px solid ${corStatus}40; padding:2px 6px; border-radius:10px; font-weight:600;">${func.statusConta}</span>
                        </div>
                        <p class="email">${func.email}</p>

                        <div style="flex:1;">
                            <div class="stat-row">
                                <span>Cadastros Hoje</span>
                                <strong class="highlight-green">${cadastrosHoje}</strong>
                            </div>
                            <div class="stat-row">
                                <span>Chamados Hoje (Dia 1)</span>
                                <strong style="color: #06b6d4;">${chamadosHoje}</strong>
                            </div>
                            <div class="stat-row">
                                <span>Cadastros Semana</span>
                                <strong class="highlight-purple">${cadastrosSemana}</strong>
                            </div>
                            <div class="stat-row">
                                <span>Lista Fria (Abertos)</span>
                                <strong>${naListaFria}</strong>
                            </div>
                            <div class="stat-row">
                                <span>Fechados (Sucesso)</span>
                                <strong class="highlight-blue">${fechados}</strong>
                            </div>
                            <div class="stat-row">
                                <span>Total Histórico</span>
                                <strong>${clientesDoFunc.length}</strong>
                            </div>
                        </div>

                        <button class="btn btn-outline" style="width: 100%; margin-top: 15px; font-size: 12px;" onclick="window.abrirModalTarefa(event, '${func.id}', '${func.nome}')">
                            + Criar Tarefa
                        </button>
                    `;
                    gridFuncionarios.appendChild(card);
                });
            }

            carregarTarefas();

        } catch (error) {
            console.error(error);
            gridFuncionarios.innerHTML = '<p style="color: #ef4444;">Erro ao carregar dados do painel.</p>';
        }
    }

    async function carregarTarefas() {
        if(!listaTarefas) return;
        listaTarefas.innerHTML = '<p style="color: rgba(255,255,255,0.5); font-size: 13px;">Carregando tarefas...</p>';
        try {
            const tarefasSnap = await getDocs(collection(db, "tarefas"));
            const tarefas = tarefasSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            tarefas.sort((a, b) => new Date(b.dataCriacao) - new Date(a.dataCriacao));

            listaTarefas.innerHTML = '';
            if(tarefas.length === 0) {
                listaTarefas.innerHTML = '<p style="color: rgba(255,255,255,0.5); font-size: 13px;">Nenhuma tarefa pendente na equipe.</p>';
                return;
            }

            tarefas.forEach(t => {
                const nomeFunc = mapaFuncionarios[t.funcionarioId] || 'Funcionário Novo';
                const prazoFormatado = t.prazo.split('-').reverse().join('/');
                const statusClasse = t.status === 'concluida' ? 'status-concluida' : 'status-pendente';
                const statusTexto = t.status === 'concluida' ? 'Concluída' : 'Pendente';

                const div = document.createElement('div');
                div.className = 'tarefa-item';
                div.innerHTML = `
                    <div class="tarefa-info">
                        <h4>${t.titulo}</h4>
                        <p><strong>Para:</strong> ${nomeFunc} • <strong>Prazo:</strong> ${prazoFormatado}</p>
                        ${t.descricao ? `<p style="margin-top: 5px; font-style: italic;">"${t.descricao}"</p>` : ''}
                    </div>
                    <div>
                        <span class="tarefa-status ${statusClasse}">${statusTexto}</span>
                    </div>
                `;
                listaTarefas.appendChild(div);
            });
        } catch (error) {
            console.error(error);
            listaTarefas.innerHTML = '<p style="color: #ef4444; font-size: 13px;">Erro ao carregar tarefas.</p>';
        }
    }

    // Funcionalidade do form
    if(formFunc) {
        formFunc.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('inputNome').value.trim();
            const email = document.getElementById('inputEmail').value.trim().toLowerCase();
            const senha = document.getElementById('inputSenha').value;
            // Capturando o CARGO
            const cargo = document.getElementById('inputCargo').value;
            
            const btnSalvar = formFunc.querySelector('button[type="submit"]');
            
            btnSalvar.innerText = 'Salvando...';
            btnSalvar.disabled = true;

            try {
                const qAtivos = await getDocs(query(collection(db, "funcionarios"), where("email", "==", email)));
                const qPre = await getDocs(query(collection(db, "pre_cadastros"), where("email", "==", email)));
                
                if(!qAtivos.empty || !qPre.empty) {
                    showToast("Este e-mail já está cadastrado no sistema!");
                    btnSalvar.innerText = 'Salvar';
                    btnSalvar.disabled = false;
                    return;
                }

                const idGeradoTemp = doc(collection(db, "pre_cadastros")).id;

                await setDoc(doc(db, "pre_cadastros", idGeradoTemp), {
                    nome: nome,
                    email: email,
                    senhaPadrao: senha, 
                    cargo: cargo, // SALVANDO O CARGO NO BANCO
                    dataRegistro: new Date().toISOString()
                });

                showToast("Funcionário pré-cadastrado com sucesso!");
                modalFunc.style.display = 'none';
                carregarDashboard();
            } catch (error) {
                console.error(error);
                showToast("Erro ao processar o pré-cadastro.");
            } finally {
                btnSalvar.innerText = 'Salvar';
                btnSalvar.disabled = false;
            }
        });
    }

    if(formTarefa) {
        formTarefa.addEventListener('submit', async (e) => {
            e.preventDefault();
            const titulo = document.getElementById('inputTarefaTitulo').value.trim();
            const descricao = document.getElementById('inputTarefaDesc').value.trim();
            const prazo = document.getElementById('inputTarefaPrazo').value;
            const funcionarioId = inputTarefaFuncId.value;
            const btnSalvar = formTarefa.querySelector('button[type="submit"]');

            if(!funcionarioId) return showToast("Erro: Funcionário não identificado.");

            btnSalvar.innerText = 'Salvando...';
            btnSalvar.disabled = true;

            try {
                await addDoc(collection(db, "tarefas"), {
                    titulo: titulo,
                    descricao: descricao,
                    prazo: prazo,
                    funcionarioId: funcionarioId,
                    adminId: currentUser.uid,
                    dataCriacao: new Date().toISOString(),
                    status: 'pendente'
                });

                showToast("Tarefa enviada para o funcionário!");
                modalTarefa.style.display = 'none';
                carregarTarefas();
            } catch (error) {
                console.error(error);
                showToast("Erro ao delegar tarefa.");
            } finally {
                btnSalvar.innerText = 'Salvar Tarefa';
                btnSalvar.disabled = false;
            }
        });
    }

    // ================= VERIFICAÇÃO DE ACESSO RESTRITO ADM (NOVA LÓGICA DE CARGOS) =================
    // Transformado em 'async' para poder puxar o Firebase
    onAuthStateChanged(auth, async user => {
        if(user){
            const superAdmins = [
                "gruponascimentoesouza@gmail.com", 
                "vitorunisuam@hotmail.com", 
                "contato.aiyranascimento@gmail.com",
                "hosannagruponascimento03@gmail.com",
                "gruponascimentoesouza1@gmail.com",
                "bentorosamariaeduarda@gmail.com"
           
            ];
            
            let temAcesso = false;

            // Se for super admin, libera direto
            if(user.email && superAdmins.includes(user.email.toLowerCase())) {
                temAcesso = true;
            } else {
                // Se não for super admin, vamos ver no banco de dados o CARGO da pessoa
                try {
                    const userDoc = await getDoc(doc(db, "funcionarios", user.uid));
                    if (userDoc.exists()) {
                        const dados = userDoc.data();
                        const cargoUsuario = dados.cargo || 'Vendedor';
                        
                        // Diretores, Gerentes e CEO têm acesso
                        if (cargoUsuario === 'Gerente' || cargoUsuario === 'Diretor' || cargoUsuario === 'CEO') {
                            temAcesso = true;
                        }
                    }
                } catch (error) {
                    console.error("Erro ao verificar cargo:", error);
                }
            }

            if(temAcesso) {
                currentUser = user;
                if(sidebar) sidebar.style.display = 'flex';
                carregarDashboard();
            } else {
                // Bloqueia quem for apenas vendedor
                alert("⛔ Acesso Negado: Esta página é restrita para Gerentes, Diretores e CEOs.");
                window.location.href = "crm.html"; 
            }

        }else{
            window.location.href = "login.html";
        }
    });

});
</script>
