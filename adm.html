<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel ADM - AMR ADV</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

body {
    display:flex;
    height:100vh;
    overflow:hidden;
    background: radial-gradient(circle at top left,#2f3f73 0%,transparent 30%),
                radial-gradient(circle at bottom right,#0f766e 0%,transparent 25%),
                linear-gradient(135deg,#0f172a,#111827,#020617);
    color: #fff;
}

/* SIDEBAR PADRÃO */
.sidebar{ width:80px; display:flex; flex-direction:column; align-items:center; padding:20px 0; flex-shrink:0; transition:width 0.4s ease; position:relative; z-index:10; backdrop-filter:blur(30px); background:rgba(255,255,255,0.06); border-right:1px solid rgba(255,255,255,0.08); box-shadow:0 0 40px rgba(0,0,0,0.25); }
.sidebar.expanded{ width:240px; }
.sidebar h2{ font-size:22px; font-weight:800; color:#fff; letter-spacing:1px; margin-bottom:30px; text-align:center; cursor:pointer; width:100%; white-space:nowrap; overflow:hidden; transition:opacity 0.3s; opacity:0; }
.sidebar.expanded h2{ opacity:1; }
.sidebar button{ width:calc(100% - 20px); background:transparent; border:none; color:rgba(255,255,255,0.7); display:flex; align-items:center; gap:15px; padding:12px 15px; margin:5px 10px; cursor:pointer; border-radius:14px; transition:all 0.3s; font-size:14px; white-space:nowrap; overflow:hidden; }
.sidebar button img{ width:24px; height:24px; filter:invert(1) opacity(0.7); flex-shrink:0; transition:transform 0.3s, filter 0.3s; }
.sidebar button span{ display:inline-block; opacity:0; transition:opacity 0.3s; font-weight:600; }
.sidebar.expanded button span{ opacity:1; }
.sidebar button:hover img{ transform:scale(1.1); filter:invert(1) opacity(1); }
.sidebar button:hover{ background:rgba(255,255,255,0.1); color:#fff; }
.active-menu { background: rgba(255,255,255,0.15) !important; color: #fff !important; }

/* MAIN E DASHBOARD ADM */
.main{ flex:1; display:flex; flex-direction:column; overflow:hidden; }
header{ height:70px; background:transparent; border-bottom:1px solid rgba(255,255,255,0.08); display:flex; justify-content:space-between; align-items:center; padding:0 30px; flex-shrink:0; }
header h1{ font-size:24px; color:#fff; font-weight:800; }

.content-area { padding: 30px; overflow-y: auto; flex: 1; }

.adm-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
.adm-header h2 { font-size: 20px; font-weight: 600; }

.grid-funcionarios {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
}

.func-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 20px;
    transition: 0.3s;
}
.func-card:hover { transform: translateY(-3px); background: rgba(255,255,255,0.08); }
.func-card h3 { font-size: 18px; margin-bottom: 5px; color: #fff; }
.func-card p.email { font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 20px; }

.stat-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-top: 1px solid rgba(255,255,255,0.05);
    font-size: 14px;
}
.stat-row span { color: rgba(255,255,255,0.7); }
.stat-row strong { color: #fff; font-weight: 700; }
.highlight-green { color: #10b981 !important; }

/* MODAL E BOTÕES */
.btn { padding:10px 18px; border-radius:12px; border:0; cursor:pointer; font-weight: 600; font-size: 14px; transition: 0.3s; }
.btn-primary { background:#fff; color:#111827; }
.btn-primary:hover { box-shadow: 0 5px 15px rgba(255,255,255,0.2); }
.btn-ghost { background:rgba(255,255,255,0.12); color:#fff; }
.btn-ghost:hover { background:rgba(255,255,255,0.2); }

.modal-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter: blur(8px); justify-content:center; align-items:center; z-index:50; }
.modal { background:#0f172a; border: 1px solid rgba(255,255,255,0.1); padding:24px; border-radius:24px; min-width:320px; max-width:400px; width:100%; box-shadow:0 20px 50px rgba(0,0,0,0.5); }
.modal h3 { margin-bottom:20px; font-size: 20px; }
.row { margin-bottom:14px; }
.modal input { width:100%; padding:12px 16px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1); border-radius:12px; color:#fff; font-size: 14px; outline: none; }
.modal input:focus { background:rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }
.actions { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }

.toast { position:fixed; right:30px; bottom:30px; background:rgba(255,255,255,0.1); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); color:#fff; padding:12px 20px; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.4); display:none; z-index:60; font-weight: 500; }
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import { getFirestore, collection, getDocs, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyAFJJAqVf3ge0WDHBpmS9E6sXKvnjuFkhw",
    authDomain: "dapapp-38637.firebaseapp.com",
    projectId: "dapapp-38637",
    storageBucket: "dapapp-38637.firebasestorage.app",
    messagingSenderId: "628852295313",
    appId: "1:628852295313:web:1234567890abcdef123456"
};

// Conexão Principal (Para ler dados e ver quem está logado)
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// Conexão Secundária (Exclusiva para CRIAR usuários sem deslogar o Admin)
const appSecundaria = initializeApp(firebaseConfig, "AppSecundaria");
const authSecundario = getAuth(appSecundaria);

document.addEventListener('DOMContentLoaded', () => {
    
    // Sidebar Efeito
    const sidebar = document.querySelector(".sidebar");
    if(sidebar){
        sidebar.addEventListener('mouseenter', () => sidebar.classList.add('expanded'));
        sidebar.addEventListener('mouseleave', () => sidebar.classList.remove('expanded'));
    }

    const toastEl = document.getElementById('toast');
    function showToast(msg){
        toastEl.innerText = msg;
        toastEl.style.display = 'block';
        clearTimeout(toastEl._t);
        toastEl._t = setTimeout(() => { toastEl.style.display = 'none'; }, 3000);
    }

    let currentUser = null;

    // Elementos da interface
    const gridFuncionarios = document.getElementById('gridFuncionarios');
    const modalBackdrop = document.getElementById('modalFuncionario');
    const btnNovo = document.getElementById('btnNovoFuncionario');
    const btnCancel = document.getElementById('btnCancel');
    const formFunc = document.getElementById('formFuncionario');

    // Abre e fecha Modal
    btnNovo.onclick = () => {
        document.getElementById('inputNome').value = '';
        document.getElementById('inputEmail').value = '';
        document.getElementById('inputSenha').value = '';
        modalBackdrop.style.display = 'flex';
    }
    btnCancel.onclick = () => modalBackdrop.style.display = 'none';

    // Carregar Dados da Equipe
    async function carregarDashboard() {
        gridFuncionarios.innerHTML = '<p style="color: rgba(255,255,255,0.5);">Carregando dados da equipe...</p>';

        try {
            // 1. Puxa todos os funcionários registrados
            const funcSnap = await getDocs(collection(db, "funcionarios"));
            const funcionarios = funcSnap.docs.map(d => ({ id: d.id, ...d.data() }));

            // 2. Puxa TODOS os clientes (Só funciona se você for Admin nas regras)
            const clientesSnap = await getDocs(collection(db, "clientes"));
            const clientes = clientesSnap.docs.map(d => d.data());

            // Data de Hoje formato "YYYY-MM-DD"
            const dataHoje = new Date().toISOString().split('T')[0];

            gridFuncionarios.innerHTML = '';

            if (funcionarios.length === 0) {
                gridFuncionarios.innerHTML = '<p style="color: rgba(255,255,255,0.5);">Nenhum funcionário cadastrado ainda.</p>';
                return;
            }

            funcionarios.forEach(func => {
                // Filtra clientes que pertencem a este funcionário
                const clientesDoFunc = clientes.filter(c => c.userId === func.id);
                
                // Filtra clientes cadastrados HOJE
                const cadastrosHoje = clientesDoFunc.filter(c => 
                    c.dataCadastro && c.dataCadastro.startsWith(dataHoje)
                ).length;

                const card = document.createElement('div');
                card.className = 'func-card';
                card.innerHTML = `
                    <h3>${func.nome}</h3>
                    <p class="email">${func.email}</p>

                    <div class="stat-row">
                        <span>Cadastros Hoje</span>
                        <strong class="highlight-green">${cadastrosHoje}</strong>
                    </div>
                    <div class="stat-row">
                        <span>Total de Clientes</span>
                        <strong>${clientesDoFunc.length}</strong>
                    </div>
                `;
                gridFuncionarios.appendChild(card);
            });

        } catch (error) {
            console.error(error);
            gridFuncionarios.innerHTML = '<p style="color: #ef4444;">Erro ao carregar dados. Verifique se você é o administrador nas regras do Firebase.</p>';
        }
    }

    // Criar Novo Funcionário
    formFunc.onsubmit = async (e) => {
        e.preventDefault();
        
        const nome = document.getElementById('inputNome').value.trim();
        const email = document.getElementById('inputEmail').value.trim();
        const senha = document.getElementById('inputSenha').value;

        const btnSalvar = formFunc.querySelector('button[type="submit"]');
        btnSalvar.innerText = 'Criando...';
        btnSalvar.disabled = true;

        try {
            // Cria a conta usando a conexão secundária (não desloga o Admin)
            const userCredential = await createUserWithEmailAndPassword(authSecundario, email, senha);
            const novoUid = userCredential.user.uid;

            // Salva o perfil no banco de dados principal
            await setDoc(doc(db, "funcionarios", novoUid), {
                nome: nome,
                email: email,
                criadoEm: new Date().toISOString()
            });

            // Desloga o usuário secundário para evitar cache cruzado
            await signOut(authSecundario);

            showToast("Funcionário adicionado com sucesso!");
            modalBackdrop.style.display = 'none';
            carregarDashboard();

        } catch (error) {
            console.error(error);
            if (error.code === 'auth/email-already-in-use') {
                showToast("Este e-mail já está em uso!");
            } else if (error.code === 'auth/weak-password') {
                showToast("A senha deve ter pelo menos 6 caracteres.");
            } else {
                showToast("Erro ao criar funcionário.");
            }
        } finally {
            btnSalvar.innerText = 'Salvar';
            btnSalvar.disabled = false;
        }
    }

    // Verifica Login
    onAuthStateChanged(auth, user => {
        if(user){
            currentUser = user;
            carregarDashboard();
        }else{
            window.location.href = "login.html";
        }
    });

});
</script>
</head>
<body>

<div class="sidebar">
    <h2 onclick="window.location.href='dashboard.html'">AMR ADV</h2>
    <button onclick="window.location.href='crm.html'">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/dashboard.png"/>
        <span>CRM</span>
    </button>
    <button onclick="window.location.href='relatorios.html'">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/combo-chart.png"/>
        <span>Relatórios</span>
    </button>
    <button onclick="window.location.href='agenda.html'">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/calendar.png"/>
        <span>Agenda</span>
    </button>
    <button class="active-menu" onclick="window.location.href='adm.html'">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/manager.png"/>
        <span>Painel ADM</span>
    </button>
</div>

<div class="main">
    <header>
        <h1>Painel Administrativo</h1>
        <button id="btnNovoFuncionario" class="btn btn-primary">+ Novo Funcionário</button>
    </header>

    <div class="content-area">
        <div class="adm-header">
            <h2>Gestão de Equipe e Desempenho</h2>
        </div>
        
        <div id="gridFuncionarios" class="grid-funcionarios">
            <!-- Cards gerados via JS -->
        </div>
    </div>
</div>

<!-- MODAL NOVO FUNCIONÁRIO -->
<div class="modal-backdrop" id="modalFuncionario">
    <div class="modal">
        <h3>Adicionar Funcionário</h3>
        <form id="formFuncionario">
            <div class="row">
                <input id="inputNome" type="text" placeholder="Nome Completo" required />
            </div>
            <div class="row">
                <input id="inputEmail" type="email" placeholder="E-mail de Acesso" required />
            </div>
            <div class="row">
                <input id="inputSenha" type="password" placeholder="Senha (mínimo 6 caracteres)" minlength="6" required />
            </div>
            <div class="actions">
                <button type="submit" class="btn btn-primary">Salvar</button>
                <button type="button" class="btn btn-ghost" id="btnCancel">Cancelar</button>
            </div>
        </form>
    </div>
</div>

<div class="toast" id="toast"></div>

</body>
</html>
