<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajuris CRM - Login DAP Advocacia</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary-color: #0c2340; --accent-color: #d4af37; --bg-color: #f5f7fa; --text-color: #333333; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--primary-color); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-container { background: #ffffff; width: 100%; max-width: 400px; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; border-top: 5px solid var(--accent-color); }
        .login-container h1 { color: var(--primary-color); margin: 0 0 5px 0; font-size: 24px; font-weight: 700; }
        .login-container h1 span { color: var(--accent-color); }
        .login-container p { color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 30px; }
        .form-group { text-align: left; margin-bottom: 20px; }
        label { font-weight: 600; display: block; margin-bottom: 8px; font-size: 13px; color: #555; text-transform: uppercase; }
        input { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-family: 'Montserrat', sans-serif; font-size: 14px; background-color: #fafafa; }
        input:focus { outline: none; border-color: var(--accent-color); background-color: #fff; box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2); }
        button { background-color: var(--accent-color); color: var(--primary-color); border: none; padding: 15px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: 700; text-transform: uppercase; transition: all 0.3s ease; }
        button:hover { background-color: #c19b2e; transform: translateY(-2px); }
        #erro-msg { color: #e74c3c; font-size: 13px; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>DAP <span>ADVOCACIA</span></h1>
        <p>Acesso ao Sistema</p>

        <form id="login-form">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha" required>
            </div>
            <button type="submit" id="btn-login">Entrar</button>
            <div id="erro-msg">E-mail ou senha inválidos.</div>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFJJAqVf3ge0WDHBpmS9E6sXKvnjuFkhw",
            authDomain: "dapapp-38637.firebaseapp.com",
            projectId: "dapapp-38637",
            storageBucket: "dapapp-38637.appspot.com",
            messagingSenderId: "628852295313",
            appId: "1:628852295313:web:1234567890abcdef123456"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const btn = document.getElementById('btn-login');
            const erroMsg = document.getElementById('erro-msg');

            btn.innerText = "Carregando...";
            erroMsg.style.display = "none";

            try {
                // Se for o admin, redireciona para admin.html. Caso contrário, para o gerador.
                await signInWithEmailAndPassword(auth, email, senha);
                if(email.includes("admin")) { // Adapte essa regra para o email do seu gestor
                    window.location.href = 'contrato-adm.html';
                } else {
                    window.location.href = 'teste.html';
                }
            } catch (error) {
                console.error(error);
                erroMsg.style.display = "block";
                btn.innerText = "Entrar";
            }
        });
    </script>
</body>
</html>
