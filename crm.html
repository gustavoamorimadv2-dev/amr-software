<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM AMR ADV</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

/* Custom Scrollbar */
::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}
::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.02); 
}
::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.1); 
    border-radius: 10px;
}
::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.2); 
}

body {
    display:flex;
    height:100vh;
    overflow:hidden;
    background:
        radial-gradient(circle at top left,#2f3f73 0%,transparent 30%),
        radial-gradient(circle at bottom right,#0f766e 0%,transparent 25%),
        linear-gradient(135deg,#0f172a,#111827,#020617);
    color: #fff;
}

/* ================= SIDEBAR ================= */
.sidebar {
    width:80px;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 0;
    flex-shrink:0;
    transition:width 0.4s ease;
    position:relative;
    z-index:10;
    backdrop-filter:blur(30px);
    background:rgba(255,255,255,0.06);
    border-right:1px solid rgba(255,255,255,0.08);
    box-shadow:0 0 40px rgba(0,0,0,0.25);
}
.sidebar.expanded { width:240px; }
.sidebar h2 {
    font-size:22px;
    font-weight:800;
    color:#fff;
    letter-spacing:1px;
    margin-bottom:30px;
    text-align:center;
    cursor:pointer;
    width:100%;
    white-space:nowrap;
    overflow:hidden;
    transition:opacity 0.3s;
    opacity:0;
}
.sidebar.expanded h2 { opacity:1; }
.sidebar button {
    width:calc(100% - 20px);
    background:transparent;
    border:none;
    color:rgba(255,255,255,0.7);
    display:flex;
    align-items:center;
    gap:15px;
    padding:12px 15px;
    margin:5px 10px;
    cursor:pointer;
    border-radius:14px;
    transition:all 0.3s;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
}
.sidebar button img {
    width:24px;
    height:24px;
    filter:invert(1) opacity(0.7);
    flex-shrink:0;
    transition:transform 0.3s, filter 0.3s;
}
.sidebar button span {
    display:inline-block;
    opacity:0;
    transition:opacity 0.3s;
    font-weight:600;
}
.sidebar.expanded button span { opacity:1; }
.sidebar button:hover img {
    transform:scale(1.1);
    filter:invert(1) opacity(1);
}
.sidebar button:hover {
    background:rgba(255,255,255,0.1);
    color:#fff;
}

/* ================= MAIN ================= */
.main {
    flex:1;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    transition:filter 0.3s;
}
.main.blur { filter:blur(5px) brightness(0.7); }

header {
    height:70px;
    background:transparent;
    border-bottom:1px solid rgba(255,255,255,0.08);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 30px;
    flex-shrink:0;
}
header h1 {
    font-size:24px;
    color:#fff;
    font-weight:800;
}
.user-info {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.8);
    background: rgba(255, 255, 255, 0.05);
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    gap: 8px;
}

/* ================= SEARCH ================= */
.search-bar {
    padding:15px 30px;
    background:transparent;
    border-bottom:1px solid rgba(255,255,255,0.08);
    display:flex;
    gap:15px;
    align-items:center;
    flex-shrink:0;
}
.search-bar input, .search-bar select,
.modal input, .modal textarea, .modal select {
    padding:12px 16px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:12px;
    color:#fff;
    font-size: 14px;
    outline: none;
    transition: 0.3s;
    backdrop-filter: blur(10px);
}
.search-bar input:focus, .search-bar select:focus,
.modal input:focus, .modal textarea:focus, .modal select:focus {
    background:rgba(255,255,255,0.15);
    border-color: rgba(255,255,255,0.3);
}
.search-bar input::placeholder, .modal input::placeholder, .modal textarea::placeholder {
    color: rgba(255,255,255,0.5);
}
.search-bar input { flex:1; }
select option { background: #111827; color: #fff; }

/* ================= KANBAN ================= */
.kanban-container {
    flex:1;
    overflow-x:auto;
    padding:20px 30px;
}
.kanban {
    display:flex;
    gap:20px;
    min-width:max-content;
    height:100%;
}
.column {
    background:rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border-radius:20px;
    padding:15px;
    min-width:320px;
    max-height:100%;
    display:flex;
    flex-direction:column;
    gap:15px;
    overflow-y:auto;
    transition: background-color 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
}
.column.drag-over {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.3);
    transform: scale(1.02);
}
.column h2 {
    margin-bottom:10px;
    font-size:14px;
    color:#fff;
    font-weight: 700;
    letter-spacing: 1px;
    opacity: 0.8;
    pointer-events: none;
}

/* ================= CARDS ================= */
.card {
    display:flex;
    background:rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    border-radius:16px;
    box-shadow:0 8px 30px rgba(0,0,0,0.2);
    cursor:pointer;
    overflow:hidden;
    transition:transform 0.2s, background 0.2s;
    position:relative;
    flex-direction:row;
    width:100%;
    min-height:200px;
}
.card:hover {
    transform:translateY(-4px);
    background:rgba(255,255,255,0.1);
}
.card.dragging {
    opacity: 0.4;
    transform: scale(0.95);
}
.card .color-bar {
    width:6px;
    height:100%;
    border-radius:16px 0 0 16px;
}
.card-content {
    padding:20px;
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    overflow:hidden;
    min-width: 0;
}
.card h3 {
    font-size:18px;
    margin-bottom:12px;
    color:#fff;
    font-weight: 700;
    padding-right: 80px; 
    word-break: break-word; 
}
.card p {
    font-size:13px;
    color:rgba(255,255,255,0.7);
    margin:5px 0;
}
.card p strong {
    color: #fff;
    font-weight: 600;
}

/* Cores dos Status */
.dia-1 .color-bar { background: #93c5fd; }
.dia-2 .color-bar { background: #60a5fa; }
.dia-3 .color-bar { background: #3b82f6; }
.dia-4 .color-bar { background: #2563eb; }
.dia-5 .color-bar { background: #1d4ed8; }
.funil-geral .color-bar { background: #8b5cf6; }
.lista-fria .color-bar { background: #3b82f6; }
.negociacao .color-bar { background: #f59e0b; }
.contrato-assinado .color-bar { background: #8b5cf6; }
.fechado .color-bar { background: #10b981; }

.card-actions {
    position:absolute;
    top:15px;
    right:15px;
    display:flex;
    gap:10px;
}
.card-actions button {
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.05);
    border-radius: 8px;
    cursor:pointer;
    padding:6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.3s;
}
.card-actions img {
    width:16px;
    height:16px;
    filter:invert(1); 
    opacity:0.8;
    transition:opacity 0.2s;
}
.card-actions button:hover { background:rgba(255,255,255,0.2); }
.card-actions button:hover img { opacity:1; }

/* ================= MODAIS ================= */
.modal-backdrop {
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    justify-content:center;
    align-items:center;
    z-index:50;
}
.modal {
    background:#0f172a;
    border: 1px solid rgba(255,255,255,0.1);
    padding:24px;
    border-radius:24px;
    min-width:320px;
    max-width:500px;
    width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,0.5);
    max-height:90vh;
    overflow-y:auto;
}
.modal h3 {
    margin-bottom:20px;
    font-size: 20px;
    font-weight: 700;
}
.modal .row { margin-bottom:14px; }
.modal input, .modal textarea, .modal select { width:100%; }
.modal textarea {
    min-height:100px;
    resize:vertical;
}
.modal .actions {
    display:flex;
    gap:10px;
    justify-content:flex-end;
    margin-top:20px;
}

/* ================= BUTTONS ================= */
.btn {
    padding:10px 18px;
    border-radius:12px;
    border:0;
    cursor:pointer;
    font-weight: 600;
    font-size: 14px;
    transition: 0.3s;
}
.btn.primary { background:#fff; color:#111827; }
.btn.primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(255,255,255,0.2);
}
.btn.ghost { background:rgba(255,255,255,0.12); color:#fff; }
.btn.ghost:hover { background:rgba(255,255,255,0.2); }
.btn-green { background: #10b981; color: #fff; border: none; cursor: pointer; }
.btn-green:hover {
    background: #059669;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
}

/* ================= DINÂMICOS ================= */
.processo-row {
    display:flex;
    gap:8px;
    margin-bottom:10px;
}
.processo-row input { flex:1; }

/* ================= TOAST ================= */
.toast {
    position:fixed;
    right:30px;
    bottom:30px;
    background:rgba(255,255,255,0.1);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    color:#fff;
    padding:12px 20px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    display:none;
    z-index:60;
    font-weight: 500;
}

/* ================= DOCUMENTOS UPLOAD ================= */
.docs-section {
    border: 1px dashed rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.03);
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 14px;
}
.docs-section h4 { font-size: 14px; margin-bottom: 12px; color: #fff; }
.doc-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.08);
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 13px;
}
.doc-item a { color: #60a5fa; text-decoration: none; word-break: break-all; flex: 1; }
.doc-item a:hover { text-decoration: underline; }
.doc-item button {
    background: transparent;
    border: none;
    color: #ef4444;
    cursor: pointer;
    font-weight: bold;
    padding: 4px 8px;
    border-radius: 4px;
    transition: 0.2s;
    margin-left: 10px;
}
.doc-item button:hover { background: rgba(239, 68, 68, 0.1); }

.col-header-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}
.btn-robot {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 8px;
    cursor: pointer;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.3s;
}
.btn-robot:hover { background: rgba(255,255,255,0.2); }
.btn-robot img { width: 20px; height: 20px; filter: invert(1); opacity: 0.9; }

/* Fila de Disparo */
.fila-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.05);
    padding: 10px 15px;
    border-radius: 10px;
    margin-bottom: 8px;
    border: 1px solid rgba(255,255,255,0.05);
}
.fila-item span { font-size: 14px; font-weight: 500; }
.btn-enviar-msg { padding: 6px 12px; font-size: 12px; border-radius: 6px; transition: 0.3s; }
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>CRM</h2>
    <button onclick="openModal(false)">
        <img src="https://img.icons8.com/ios-glyphs/30/ffffff/plus-math.png" alt="Novo"/>
        <span>Novo Cliente</span>
    </button>
    <button id="btnAgente">
        <img src="https://img.icons8.com/ios-glyphs/30/ffffff/bot.png" alt="Bot"/>
        <span>Agente Bot</span>
    </button>
</div>

<!-- MAIN -->
<div class="main">
    <header>
        <h1>Pipeline</h1>
        <div class="user-info">
            <span id="userName">Usuário Conectado</span>
        </div>
    </header>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Buscar por nome, CPF ou processo...">
        <select id="filterStatus">
            <option value="">Todos os Status</option>
            <option value="dia-1">Dia 1</option>
            <option value="dia-2">Dia 2</option>
            <option value="dia-3">Dia 3</option>
            <option value="dia-4">Dia 4</option>
            <option value="dia-5">Dia 5</option>
            <option value="funil-geral">Funil Geral</option>
            <option value="lista-fria">Lista Fria</option>
            <option value="negociacao">Em Negociação</option>
            <option value="contrato-assinado">Contrato Assinado</option>
            <option value="fechado">Fechado</option>
        </select>
    </div>

    <div class="kanban-container">
        <div class="kanban">
            <!-- Pipeline de 5 Dias -->
            <div class="column" id="dia-1">
                <h2>DIA 1</h2>
            </div>
            <div class="column" id="dia-2">
                <h2>DIA 2</h2>
            </div>
            <div class="column" id="dia-3">
                <h2>DIA 3</h2>
            </div>
            <div class="column" id="dia-4">
                <h2>DIA 4</h2>
            </div>
            <div class="column" id="dia-5">
                <h2>DIA 5</h2>
            </div>
            
            <!-- Funil Geral -->
            <div class="column" id="funil-geral">
                <h2>FUNIL GERAL</h2>
            </div>

            <!-- Colunas Antigas -->
            <div class="column" id="lista-fria">
                <h2>LISTA FRIA</h2>
            </div>
            <div class="column" id="negociacao">
                <h2>EM NEGOCIAÇÃO</h2>
            </div>
            <div class="column" id="contrato-assinado">
                <h2>CONTRATO ASSINADO</h2>
            </div>
            <div class="column" id="fechado">
                <h2>FECHADO</h2>
            </div>
        </div>
    </div>
</div>

<!-- MODAL NOVO/EDITAR CLIENTE -->
<div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="clientForm">
        <h3 id="modalTitle">Novo Cliente</h3>
        <div class="row">
            <input type="text" id="inputNome" placeholder="Nome Completo">
        </div>
        <div class="row">
            <input type="text" id="inputCPF" placeholder="CPF/CNPJ">
        </div>
        <div class="row">
            <select id="inputStatus">
                <option value="dia-1">Dia 1</option>
                <option value="dia-2">Dia 2</option>
                <option value="dia-3">Dia 3</option>
                <option value="dia-4">Dia 4</option>
                <option value="dia-5">Dia 5</option>
                <option value="funil-geral">Funil Geral</option>
                <option value="lista-fria">Lista Fria</option>
                <option value="negociacao">Em Negociação</option>
                <option value="contrato-assinado">Contrato Assinado</option>
                <option value="fechado">Fechado</option>
            </select>
        </div>
        <div class="row">
            <input type="text" id="inputClasse" placeholder="Classe da Ação">
        </div>
        <div class="row">
            <input type="number" id="inputValor" placeholder="Valor da Causa (R$)">
        </div>
        <div class="row">
            <input type="text" id="inputEstado" placeholder="Estado (Ex: São Paulo)">
        </div>
        
        <div class="docs-section">
            <h4>Telefones</h4>
            <div id="telefonesContainer"></div>
            <button type="button" id="btnAddTelefone" class="btn ghost">+ Adicionar Telefone</button>
        </div>

        <div class="docs-section">
            <h4>Processos</h4>
            <div id="processosContainer"></div>
        </div>

        <div class="docs-section">
            <h4>Documentos</h4>
            <input type="file" id="inputFile" multiple style="display:none">
            <button type="button" id="btnTriggerFile" class="btn ghost">Anexar Arquivo</button>
            <p id="uploadProgress" style="display:none; font-size:12px; margin-top:10px;"></p>
            <div id="docsList" style="margin-top: 10px;"></div>
        </div>

        <div class="row">
            <textarea id="inputObs" placeholder="Observações Gerais"></textarea>
        </div>

        <div class="actions">
            <button class="btn ghost" id="btnCancel" onclick="closeModal()">Cancelar</button>
            <button class="btn primary" id="btnAdd">Salvar Cliente</button>
        </div>
    </div>
</div>

<!-- MODAL AGENTE BOT -->
<div class="modal-backdrop" id="modalAgenteBackdrop">
    <div class="modal">
        <h3>Agente Bot WhatsApp</h3>
        <div class="row">
            <textarea id="agenteMensagem" placeholder="Olá {nome}, tudo bem? ..."></textarea>
        </div>
        <button class="btn primary" id="btnCarregarFila" style="width:100%; margin-bottom:15px;">Carregar Fila (Lista Fria)</button>
        <div id="agenteFilaContainer" style="display:none; margin-bottom:15px; max-height:200px; overflow-y:auto;">
            <div id="agenteLista"></div>
        </div>
        <div class="actions">
            <button class="btn ghost" id="btnFecharAgente">Fechar</button>
        </div>
    </div>
</div>

<div class="toast" id="toast">Aviso</div>
<audio id="coinSound" src=""></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import {
    getFirestore, collection, addDoc, getDocs, doc, setDoc, updateDoc, query, where
} from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";
import {
    getAuth, onAuthStateChanged, signInAnonymously
} from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";
import {
    getStorage, ref, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.5.0/firebase-storage.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
    apiKey: "AIzaSyAFJJAqVf3ge0WDHBpmS9E6sXKvnjuFkhw",
    authDomain: "dapapp-38637.firebaseapp.com",
    projectId: "dapapp-38637",
    storageBucket: "dapapp-38637.firebasestorage.app",
    messagingSenderId: "628852295313",
    appId: "1:628852295313:web:1234567890abcdef123456"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
let storage;

try {
    storage = getStorage(app);
} catch (error) {
    console.error("Storage indisponível:", error);
}

window.firebaseDB = db;

/* ================= VARIÁVEIS GLOBAIS E DOM ================= */
const STATUS = [
    'dia-1', 'dia-2', 'dia-3', 'dia-4', 'dia-5', 
    'funil-geral', 'lista-fria', 'negociacao', 'contrato-assinado', 'fechado'
];
const cardsMap = {};
let currentUser = null;
let draggedCard = null;

const sidebar = document.querySelector(".sidebar");
const mainContent = document.querySelector(".main");

const modalBackdrop = document.getElementById('modalBackdrop');
const clientForm = document.getElementById('clientForm');

const inputNome = document.getElementById('inputNome');
const inputCPF = document.getElementById('inputCPF');
const inputObs = document.getElementById('inputObs');
const inputStatus = document.getElementById('inputStatus');
const inputClasse = document.getElementById('inputClasse');
const inputValor = document.getElementById('inputValor');
const inputEstado = document.getElementById('inputEstado');

const btnAdd = document.getElementById('btnAdd');
const btnCancel = document.getElementById('btnCancel');
const searchInput = document.getElementById('searchInput');
const filterStatus = document.getElementById('filterStatus');
const toastEl = document.getElementById('toast');
const processosContainer = document.getElementById('processosContainer');
const telefonesContainer = document.getElementById('telefonesContainer');
const btnAddTelefone = document.getElementById('btnAddTelefone');

/* ================= VARIÁVEIS DOCUMENTOS ================= */
const inputFile = document.getElementById('inputFile');
const btnTriggerFile = document.getElementById('btnTriggerFile');
const docsList = document.getElementById('docsList');
const uploadProgress = document.getElementById('uploadProgress');
let currentDocs = [];

/* ================= VARIÁVEIS AGENTE WHATSAPP ================= */
const btnAgente = document.getElementById('btnAgente');
const modalAgenteBackdrop = document.getElementById('modalAgenteBackdrop');
const btnFecharAgente = document.getElementById('btnFecharAgente');
const btnCarregarFila = document.getElementById('btnCarregarFila');
const agenteMensagem = document.getElementById('agenteMensagem');
const agenteFilaContainer = document.getElementById('agenteFilaContainer');
const agenteLista = document.getElementById('agenteLista');

/* ================= INIT APP ================= */
document.addEventListener('DOMContentLoaded', () => {

    // Login Anônimo para funcionamento sem página de auth
    signInAnonymously(auth).catch(console.error);

    onAuthStateChanged(auth, async (user) => {
        if(user) {
            currentUser = user;
            await refreshBoard();
        }
    });

    if(sidebar && mainContent){
        sidebar.addEventListener('mouseenter', () => {
            sidebar.classList.add('expanded');
            mainContent.classList.add('blur');
        });
        sidebar.addEventListener('mouseleave', () => {
            sidebar.classList.remove('expanded');
            mainContent.classList.remove('blur');
        });
    }

    setupDragAndDropZones();

    // Filtros
    searchInput.addEventListener('input', applyFilters);
    filterStatus.addEventListener('change', applyFilters);
});

/* ================= FUNÇÕES CORE ================= */
function showToast(msg){
    toastEl.innerText = msg;
    toastEl.style.display = 'block';
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => { toastEl.style.display = 'none'; },3000);
}

window.forceDownload = async function(url, filename, event) {
    if(event) {
        event.preventDefault();
        event.stopPropagation();
    }
    showToast("Iniciando download...");
    try {
        const response = await fetch(url);
        const blob = await response.blob();
        const objectUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = objectUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(objectUrl);
    } catch (error) {
        console.warn("Bloqueio de CORS. Abrindo em nova aba.", error);
        window.open(url, '_blank');
    }
};

/* ================= FIRESTORE ================= */
async function getClientes(){
    if(!currentUser) return [];
    const q = query(collection(db,"clientes"), where("userId","==",currentUser.uid));
    const snapshot = await getDocs(q);
    return snapshot.docs.map(docData => ({ id: docData.id, ...docData.data() }));
}

async function saveCliente(cliente){
    if(!currentUser) return;
    cliente.userId = currentUser.uid;

    if(cliente.id){
        const docRef = doc(db,"clientes",cliente.id);
        await setDoc(docRef,cliente);
    }else{
        const docRef = await addDoc(collection(db,"clientes"), cliente);
        cliente.id = docRef.id;
    }
}

/* ================= AVANÇO AUTOMÁTICO DE DIAS ================= */
async function avancarPipelineAutomaticamente(clientes) {
    const hoje = new Date();
    let atualizouAlgum = false;

    for (let cliente of clientes) {
        if (!cliente.dataCriacao) continue;

        if (cliente.status && cliente.status.startsWith('dia-')) {
            const dataCriacao = new Date(cliente.dataCriacao);
            const diferencaTempo = Math.abs(hoje - dataCriacao);
            const diferencaDias = Math.floor(diferencaTempo / (1000 * 60 * 60 * 24)); 

            let novoStatus = cliente.status;

            if (diferencaDias >= 5) {
                novoStatus = 'funil-geral';
            } else if (diferencaDias > 0) {
                novoStatus = `dia-${diferencaDias + 1}`;
            }

            if (novoStatus !== cliente.status) {
                cliente.status = novoStatus;
                await updateDoc(doc(db, "clientes", cliente.id), { status: novoStatus });
                atualizouAlgum = true;
            }
        }
    }
    
    if(atualizouAlgum) {
        showToast("Cards avançaram no pipeline automaticamente!");
    }
}

/* ================= RENDERIZAR QUADRO ================= */
async function refreshBoard() {
    let clientes = await getClientes();
    await avancarPipelineAutomaticamente(clientes);
    clientes = await getClientes(); // Fetch atualizado

    // Limpa colunas
    STATUS.forEach(s => {
        const col = document.getElementById(s);
        if(col) col.querySelectorAll('.card').forEach(c => c.remove());
    });

    clientes.forEach(c => criarCard(c));
}

function applyFilters() {
    const text = searchInput.value.toLowerCase();
    const st = filterStatus.value;
    document.querySelectorAll('.card').forEach(card => {
        const matchText = card.innerText.toLowerCase().includes(text);
        const matchStatus = st === "" || card.dataset.status === st;
        card.style.display = (matchText && matchStatus) ? "flex" : "none";
    });
}

window.openModal = function(edit = false, data = null) {
    modalBackdrop.style.display = 'flex';
    document.getElementById('modalTitle').innerText = edit ? "Editar Cliente" : "Novo Cliente";
    processosContainer.innerHTML = '';
    telefonesContainer.innerHTML = '';

    if(edit && data){
        inputNome.value = data.nome || "";
        inputCPF.value = data.cpf || "";
        inputObs.value = data.obs || "";
        inputStatus.value = data.status || "dia-1";
        inputClasse.value = data.classe || "";
        inputValor.value = data.valor || "";
        inputEstado.value = data.estado || "";

        const processos = data.processo ? data.processo.split(',').map(p => p.trim()) : [''];
        processos.forEach(p => addProcessoField(p));

        const telefones = data.numeros ? data.numeros.split(',').map(t => t.trim()) : [''];
        telefones.forEach(t => addTelefoneField(t));

        currentDocs = Array.isArray(data.documentos) ? [...data.documentos] : [];
        clientForm.dataset.editId = data.id;
    } else {
        addProcessoField();
        addTelefoneField();
        inputNome.value = "";
        inputCPF.value = "";
        inputObs.value = "";
        inputStatus.value = "dia-1";
        inputClasse.value = "";
        inputValor.value = "";
        inputEstado.value = "";
        currentDocs = [];
        delete clientForm.dataset.editId;
    }
    renderDocsList();
}

window.closeModal = function() {

/* ================= CARDS & DRAG/DROP ================= */
function criarCard(cliente) {
    const status = cliente.status || 'dia-1';
    const col = document.getElementById(status);
    if(!col) return;

    const card = document.createElement('div');
    card.className = `card ${status}`;
    card.dataset.id = cliente.id;
    card.dataset.status = status;
    card.dataset.nome = cliente.nome.toLowerCase();
    card.draggable = true;

    const colorBar = document.createElement('div');
    colorBar.className = 'color-bar';
    card.appendChild(colorBar);

    const actionsDiv = document.createElement('div');
    actionsDiv.className = 'card-actions';

    const btnCall = document.createElement('button');
    btnCall.onclick = (e) => {
        e.stopPropagation();
        const numero = cliente.numeros ? cliente.numeros.split(',')[0].trim() : '';
        if(numero) window.open(`tel:${numero}`);
    };
    btnCall.innerHTML = '<img src="https://img.icons8.com/ios-glyphs/30/000000/phone.png"/>';

    const btnWa = document.createElement('button');
    btnWa.onclick = (e) => {
        e.stopPropagation();
        const numero = cliente.numeros ? cliente.numeros.split(',')[0].trim() : '';
        if(numero) window.open(`https://wa.me/55${numero.replace(/\D/g,'')}`, '_blank');
    };
    btnWa.innerHTML = '<img src="https://img.icons8.com/ios-glyphs/30/000000/whatsapp.png"/>';

    actionsDiv.appendChild(btnCall);
    actionsDiv.appendChild(btnWa);
    card.appendChild(actionsDiv);

    const contentDiv = document.createElement('div');
    contentDiv.className = 'card-content';

    const processosArray = cliente.processo ? cliente.processo.split(',').map(p => p.trim()) : [];
    const primeiroProcesso = processosArray.length > 0 ? processosArray[0] : '-';

    contentDiv.innerHTML = `
        <h3>${cliente.nome}</h3>
        <p><strong>CPF:</strong> ${cliente.cpf || '-'}</p>
        <p><strong>Classe:</strong> ${cliente.classe || '-'}</p>
        <p><strong>Processo:</strong> ${primeiroProcesso}</p>
        <p><strong>Valor:</strong> R$ ${cliente.valor || 0}</p>
    `;

    if (Array.isArray(cliente.documentos) && cliente.documentos.length > 0) {
        const docsDiv = document.createElement('div');
        docsDiv.style.marginTop = "12px";
        docsDiv.innerHTML = `<p style="font-weight: 600; color: #fff; margin-bottom: 5px;">Documentos Anexos:</p>`;
        
        cliente.documentos.forEach(arquivo => {
            const link = document.createElement('a');
            link.href = "javascript:void(0)";
            link.style.display = "block";
            link.style.fontSize = "13px";
            link.style.color = "#60a5fa"; 
            link.style.textDecoration = "none";
            link.style.margin = "4px 0";
            link.innerHTML = `📄 ${arquivo.name}`;
            link.onclick = (e) => {
                e.stopPropagation();
                window.forceDownload(arquivo.url, arquivo.name, e);
            };
            docsDiv.appendChild(link);
        });
        contentDiv.appendChild(docsDiv);
    }

    card.appendChild(contentDiv);
    card.onclick = () => openModal(true, cliente);

    addDragEventsToCard(card);
    col.appendChild(card);
    cardsMap[cliente.id] = card;
}

function addDragEventsToCard(card) {
    card.addEventListener('dragstart', () => {
        draggedCard = card;
        setTimeout(() => card.classList.add('dragging'), 0);
    });
    card.addEventListener('dragend', async () => {
        draggedCard = null;
        card.classList.remove('dragging');
        
        const newCol = card.parentElement;
        if(newCol && newCol.classList.contains('column') && card.dataset.status !== newCol.id) {
            const newStatus = newCol.id;
            card.dataset.status = newStatus;
            card.className = `card ${newStatus}`;
            
            // Atualiza no Firebase
            await updateDoc(doc(db, "clientes", card.dataset.id), { status: newStatus });
            showToast("Status atualizado!");
        }
    });
}

function setupDragAndDropZones() {
    document.querySelectorAll('.column').forEach(col => {
        col.addEventListener('dragover', e => {
            e.preventDefault();
            col.classList.add('drag-over');
        });
        col.addEventListener('dragleave', () => {
            col.classList.remove('drag-over');
        });
        col.addEventListener('drop', e => {
            e.preventDefault();
            col.classList.remove('drag-over');
            if (draggedCard) {
                col.appendChild(draggedCard);
            }
        });
    });
}

/* ================= UPLOAD DE DOCUMENTOS ================= */
function renderDocsList() {
    docsList.innerHTML = '';
    if (currentDocs.length === 0) {
        docsList.innerHTML = '<span style="color:rgba(255,255,255,0.5); font-size:12px;">Nenhum documento anexado.</span>';
        return;
    }
    currentDocs.forEach((arquivo, index) => {
        const div = document.createElement('div');
        div.className = 'doc-item';
        div.innerHTML = `<a href="javascript:void(0)" onclick="window.forceDownload('${arquivo.url}', '${arquivo.name}', event)">📄 ${arquivo.name}</a>`;
        
        const btnRemove = document.createElement('button');
        btnRemove.type = 'button';
        btnRemove.innerText = 'X';
        btnRemove.onclick = () => {
            currentDocs.splice(index, 1);
            renderDocsList();
        };
        div.appendChild(btnRemove);
        docsList.appendChild(div);
    });
}

btnTriggerFile.onclick = () => inputFile.click();

inputFile.onchange = async (e) => {
    if (!storage) return showToast("Storage indisponível");
    const files = Array.from(e.target.files);
    if (!files.length || !currentUser) return;
    
    uploadProgress.style.display = 'block';
    uploadProgress.style.color = '#f59e0b';
    uploadProgress.innerText = `Enviando ${files.length} arquivo(s)... Aguarde.`;
    
    let errorOccurred = false;
    try {
        for (let file of files) {
            try {
                const uniqueName = Date.now() + "_" + file.name;
                const storageRef = ref(storage, `documentos/${currentUser.uid}/${uniqueName}`);
                await uploadBytes(storageRef, file);
                const url = await getDownloadURL(storageRef);
                currentDocs.push({ name: file.name, url: url });
            } catch (error) {
                errorOccurred = true;
                showToast("Erro ao enviar: " + file.name);
            }
        }
    } finally {
        if (errorOccurred) {
            uploadProgress.style.color = '#ef4444';
            uploadProgress.innerText = 'Erro no upload.';
        } else {
            uploadProgress.style.color = '#10b981';
            uploadProgress.innerText = 'Upload concluído!';
        }
        setTimeout(() => uploadProgress.style.display = 'none', 3000);
        inputFile.value = ''; 
        renderDocsList();
    }
};
