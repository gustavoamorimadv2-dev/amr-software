<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM AMR ADV</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">

<style>

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body {
    display:flex;
    background:#f0f2f5;
    height:100vh;
    overflow:hidden;
}

/* ================= SIDEBAR ================= */

.sidebar {
    width:80px;
    background:#1e1e2f;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 0;
    flex-shrink:0;
    transition:width 0.4s ease;
    position:relative;
    z-index:10;
}

.sidebar.expanded {
    width:220px;
}

.sidebar h2 {
    font-size:22px;
    font-family:'Poppins',sans-serif;
    font-weight:600;
    color:#fff;
    letter-spacing:1px;
    margin-bottom:30px;
    text-align:center;
    cursor:pointer;
    width:100%;
    white-space:nowrap;
    overflow:hidden;
    transition:opacity 0.3s;
    opacity:0;
}

.sidebar.expanded h2 {
    opacity:1;
}

.sidebar button {
    width:100%;
    background:transparent;
    border:none;
    color:#fff;
    display:flex;
    align-items:center;
    gap:15px;
    padding:12px 20px;
    margin:5px 0;
    cursor:pointer;
    border-radius:10px;
    transition:background 0.3s,color 0.3s;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
}

.sidebar button img {
    width:28px;
    height:28px;
    filter:invert(1);
    flex-shrink:0;
    transition:transform 0.3s;
}

.sidebar button span {
    display:inline-block;
    opacity:0;
    transition:opacity 0.3s;
    font-weight:500;
}

.sidebar.expanded button span {
    opacity:1;
}

.sidebar button:hover img {
    transform:scale(1.1);
}

.sidebar button:hover {
    background:#2a2a40;
}

/* ================= MAIN ================= */

.main {
    flex:1;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    transition:filter 0.3s;
}

.main.blur {
    filter:blur(4px) brightness(0.85);
}

header {
    height:60px;
    background:#fff;
    border-bottom:1px solid #ddd;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
    flex-shrink:0;
}

header h1 {
    font-size:22px;
    color:#1e1e2f;
    font-family:'Poppins',sans-serif;
}

header button {
    padding:8px 16px;
    background:#1e1e2f;
    color:#fff;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

/* ================= SEARCH ================= */

.search-bar {
    padding:10px 20px;
    background:#fff;
    border-bottom:1px solid #ddd;
    display:flex;
    gap:10px;
    align-items:center;
    flex-shrink:0;
}

.search-bar input,
.search-bar select {
    padding:8px;
    border:1px solid #ccc;
    border-radius:6px;
}

.search-bar input {
    flex:1;
}

/* ================= KANBAN ================= */

.kanban-container {
    flex:1;
    overflow-x:auto;
    padding:20px;
}

.kanban {
    display:flex;
    gap:20px;
    min-width:max-content;
    height:100%;
}

.column {
    background:#fff;
    border-radius:15px;
    padding:15px;
    min-width:320px;
    max-height:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
