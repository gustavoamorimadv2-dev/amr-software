<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discador (Twilio) - AMR ADV</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Twilio Voice SDK -->
<script src="https://sdk.twilio.com/js/voice/releases/2.4.1/twilio.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

body {
    display:flex;
    height:100vh;
    overflow:hidden;
    background: radial-gradient(circle at top left,#2f3f73 0%,transparent 30%),
                radial-gradient(circle at bottom right,#0f766e 0%,transparent 25%),
                linear-gradient(135deg,#0f172a,#111827,#020617);
    color: #fff;
}

/* ================= SIDEBAR ================= */
.sidebar{ width:80px; display:flex; flex-direction:column; align-items:center; padding:20px 0; flex-shrink:0; transition:width 0.4s ease; position:relative; z-index:10; backdrop-filter:blur(30px); background:rgba(255,255,255,0.06); border-right:1px solid rgba(255,255,255,0.08); box-shadow:0 0 40px rgba(0,0,0,0.25); }
.sidebar.expanded{ width:240px; }
.sidebar h2{ font-size:22px; font-weight:800; color:#fff; letter-spacing:1px; margin-bottom:30px; text-align:center; cursor:pointer; width:100%; white-space:nowrap; overflow:hidden; transition:opacity 0.3s; opacity:0; }
.sidebar.expanded h2{ opacity:1; }
.sidebar button{ width:calc(100% - 20px); background:transparent; border:none; color:rgba(255,255,255,0.7); display:flex; align-items:center; gap:15px; padding:12px 15px; margin:5px 10px; cursor:pointer; border-radius:14px; transition:all 0.3s; font-size:14px; white-space:nowrap; overflow:hidden; }
.sidebar button img{ width:24px; height:24px; filter:invert(1) opacity(0.7); flex-shrink:0; transition:transform 0.3s, filter 0.3s; }
.sidebar button span{ display:inline-block; opacity:0; transition:opacity 0.3s; font-weight:600; }
.sidebar.expanded button span{ opacity:1; }
.sidebar button:hover img{ transform:scale(1.1); filter:invert(1) opacity(1); }
.sidebar button:hover{ background:rgba(255,255,255,0.1); color:#fff; }
.active-menu { background: rgba(255,255,255,0.15) !important; color: #fff !important; }

/* ================= MAIN ================= */
.main{ flex:1; display:flex; flex-direction:column; overflow:hidden; }
header{ height:70px; background:transparent; border-bottom:1px solid rgba(255,255,255,0.08); display:flex; justify-content:space-between; align-items:center; padding:0 30px; flex-shrink:0; }
header h1{ font-size:24px; color:#fff; font-weight:800; }

/* ================= DISCADOR UI ================= */
.dialer-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
}

.dialer-card {
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 40px;
    width: 100%;
    max-width: 600px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.dialer-header {
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 20px;
}

.dialer-header span.badge {
    background: rgba(59, 130, 246, 0.2);
    color: #60a5fa;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.dialer-header h2 {
    font-size: 28px;
    margin-top: 10px;
    color: #fff;
}

.client-info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    background: rgba(255,255,255,0.03);
    padding: 20px;
    border-radius: 16px;
}

.info-box {
    display: flex;
    flex-direction: column;
}

.info-box strong {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
}

.info-box span {
    font-size: 14px;
    color: #fff;
    font-weight: 500;
}

/* Lista de Telefones */
.phones-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 10px;
}

.phone-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.05);
    padding: 12px 20px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.05);
}

.phone-number {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 1px;
}

/* Botões */
.btn {
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: 0.3s;
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
}

.btn-call {
    background: #10b981;
    color: #fff;
    box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
}
.btn-call:hover { background: #059669; transform: translateY(-2px); }

.btn-hangup {
    background: #ef4444;
    color: #fff;
    box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
    display: none; /* Oculto por padrão */
}
.btn-hangup:hover { background: #dc2626; transform: translateY(-2px); }

.nav-buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 20px;
}

.btn-nav {
    background: rgba(255,255,255,0.1);
    color: #fff;
}
.btn-nav:hover:not(:disabled) {
    background: rgba(255,255,255,0.2);
}
.btn-nav:disabled {
    opacity: 0.3;
    cursor: not-allowed;
}

/* Status do Twilio */
#twilioStatus {
    text-align: center;
    font-size: 12px;
    color: #f59e0b;
    margin-top: -10px;
    font-weight: 600;
}

.toast { position:fixed; right:30px; bottom:30px; background:rgba(255,255,255,0.1); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); color:#fff; padding:12px 20px; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.4); display:none; z-index:60; font-weight: 500; }
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyAFJJAqVf3ge0WDHBpmS9E6sXKvnjuFkhw",
    authDomain: "dapapp-38637.firebaseapp.com",
    projectId: "dapapp-38637",
    storageBucket: "dapapp-38637.firebasestorage.app",
    messagingSenderId: "628852295313",
    appId: "1:628852295313:web:1234567890abcdef123456"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

document.addEventListener('DOMContentLoaded', () => {
    
    // Animação da Sidebar
    const sidebar = document.querySelector(".sidebar");
    if(sidebar){
        sidebar.addEventListener('mouseenter', () => sidebar.classList.add('expanded'));
        sidebar.addEventListener('mouseleave', () => sidebar.classList.remove('expanded'));
    }

    const toastEl = document.getElementById('toast');
    function showToast(msg){
        toastEl.innerText = msg;
        toastEl.style.display = 'block';
        clearTimeout(toastEl._t);
        toastEl._t = setTimeout(() => { toastEl.style.display = 'none'; }, 3000);
    }

    // Variáveis Globais do Discador
    let currentUser = null;
    let filaFria = [];
    let indiceAtual = 0;

    // Twilio Globais
    let twilioDevice = null;
    let chamadaAtiva = null;
    const twilioStatus = document.getElementById('twilioStatus');

    // =========================================================================
    // ATENÇÃO: COLOQUE AQUI A URL DO SEU BACKEND QUE GERA O TOKEN DO TWILIO
    // Exemplo: "https://us-central1-dapapp-38637.cloudfunctions.net/twilioToken"
    // =========================================================================
    const URL_SERVIDOR_TWILIO = "SUA_URL_DO_TOKEN_AQUI";

    // Inicializar o Twilio
    async function setupTwilio() {
        if (URL_SERVIDOR_TWILIO === "SUA_URL_DO_TOKEN_AQUI") {
            twilioStatus.innerText = "Twilio não configurado. As ligações abrirão o App nativo do PC/Celular.";
            return;
        }

        try {
            twilioStatus.innerText = "Conectando ao provedor de voz...";
            const response = await fetch(URL_SERVIDOR_TWILIO);
            const data = await response.json();
            
            twilioDevice = new Twilio.Device(data.token, {
                codecPreferences: ["opus", "pcmu"],
                fakeLocalDTMF: true,
                enableRingingState: true
            });

            twilioDevice.on("ready", () => {
                twilioStatus.innerText = "🟢 Discador pronto para uso";
                twilioStatus.style.color = "#10b981";
            });

            twilioDevice.on("error", (error) => {
                console.error("Twilio Error:", error);
                twilioStatus.innerText = "🔴 Erro no discador. Verifique a conexão.";
                twilioStatus.style.color = "#ef4444";
            });

            twilioDevice.register();

        } catch (error) {
            console.error("Erro ao pegar o token do Twilio:", error);
            twilioStatus.innerText = "🔴 Falha ao autenticar o Twilio.";
            twilioStatus.style.color = "#ef4444";
        }
    }

    // Fazer a ligação
    function fazerLigacao(numeroFormatado, btnLigar, btnDesligar) {
        if (!twilioDevice || !twilioDevice.isRegistered) {
            // Fallback (Plano B): Se o Twilio não estiver rodando, tenta abrir o App de ligação do Windows/Mac/Celular
            window.open(`tel:${numeroFormatado}`, '_self');
            return;
        }

        const params = { To: numeroFormatado };
        chamadaAtiva = twilioDevice.connect({ params });

        btnLigar.style.display = 'none';
        btnDesligar.style.display = 'flex';
        twilioStatus.innerText = `Chamando ${numeroFormatado}...`;

        chamadaAtiva.on("accept", () => {
            twilioStatus.innerText = `Em chamada com ${numeroFormatado}`;
        });

        chamadaAtiva.on("disconnect", () => {
            encerrarUI(btnLigar, btnDesligar);
        });

        chamadaAtiva.on("cancel", () => {
            encerrarUI(btnLigar, btnDesligar);
        });
    }

    // Desligar a ligação
    function desligarChamada(btnLigar, btnDesligar) {
        if (chamadaAtiva) {
            chamadaAtiva.disconnect();
        }
        encerrarUI(btnLigar, btnDesligar);
    }

    function encerrarUI(btnLigar, btnDesligar) {
        btnLigar.style.display = 'flex';
        btnDesligar.style.display = 'none';
        twilioStatus.innerText = "🟢 Discador pronto para uso";
        chamadaAtiva = null;
    }

    // =========================================================================

    // Elementos da UI do Discador
    const queueStatus = document.getElementById('queueStatus');
    const clientName = document.getElementById('clientName');
    const clientCpf = document.getElementById('clientCpf');
    const clientState = document.getElementById('clientState');
    const clientProcess = document.getElementById('clientProcess');
    const clientValue = document.getElementById('clientValue');
    const phonesList = document.getElementById('phonesList');
    
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');

    // Buscar Clientes da Lista Fria
    async function carregarFila() {
        if(!currentUser) return;
        
        try {
            const q = query(
                collection(db, "clientes"),
                where("userId", "==", currentUser.uid),
                where("status", "==", "lista-fria")
            );

            const snapshot = await getDocs(q);
            filaFria = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

            if (filaFria.length > 0) {
                renderizarClienteAtual();
            } else {
                mostrarFilaVazia();
            }

        } catch (error) {
            console.error(error);
            showToast("Erro ao carregar a lista fria.");
        }
    }

    function renderizarClienteAtual() {
        if (filaFria.length === 0) return;

        const cliente = filaFria[indiceAtual];
        queueStatus.innerText = `CLIENTE ${indiceAtual + 1} DE ${filaFria.length}`;

        clientName.innerText = cliente.nome || 'Sem Nome';
        clientCpf.innerText = cliente.cpf || '-';
        clientState.innerText = cliente.estado || '-';
        
        const primeiroProcesso = cliente.processo ? cliente.processo.split(',')[0].trim() : '-';
        clientProcess.innerText = primeiroProcesso;
        clientValue.innerText = cliente.valor ? `R$ ${cliente.valor}` : 'R$ 0';

        // Renderiza os telefones do cliente
        phonesList.innerHTML = '';
        
        if (cliente.numeros && cliente.numeros.trim() !== '') {
            const numeros = cliente.numeros.split(',').map(n => n.trim());
            
            numeros.forEach(numero => {
                // Remove tudo que não for número e garante o +55 para o Twilio (Brasil)
                const numLimpo = numero.replace(/\D/g, '');
                const ddi = numLimpo.startsWith('55') ? numLimpo : `55${numLimpo}`;
                const numeroParaLigar = `+${ddi}`;

                const divPhone = document.createElement('div');
                divPhone.className = 'phone-item';

                // Botão de Ligar
                const btnLigar = document.createElement('button');
                btnLigar.className = 'btn btn-call';
                btnLigar.innerHTML = '📞 Ligar';
                
                // Botão de Desligar
                const btnDesligar = document.createElement('button');
                btnDesligar.className = 'btn btn-hangup';
                btnDesligar.innerHTML = '⏹ Desligar';

                btnLigar.onclick = () => fazerLigacao(numeroParaLigar, btnLigar, btnDesligar);
                btnDesligar.onclick = () => desligarChamada(btnLigar, btnDesligar);

                divPhone.innerHTML = `<span class="phone-number">${numero}</span>`;
                
                const btnContainer = document.createElement('div');
                btnContainer.appendChild(btnLigar);
                btnContainer.appendChild(btnDesligar);
                divPhone.appendChild(btnContainer);

                phonesList.appendChild(divPhone);
            });
        } else {
            phonesList.innerHTML = '<p style="color: rgba(255,255,255,0.5); text-align: center; padding: 10px;">Nenhum telefone cadastrado para este cliente.</p>';
        }

        atualizarBotoesNav();
    }

    function mostrarFilaVazia() {
        queueStatus.innerText = "FILA VAZIA";
        clientName.innerText = "Nenhum cliente na lista fria";
        clientCpf.innerText = "-";
        clientState.innerText = "-";
        clientProcess.innerText = "-";
        clientValue.innerText = "-";
        phonesList.innerHTML = '';
        btnPrev.disabled = true;
        btnNext.disabled = true;
    }

    function atualizarBotoesNav() {
        btnPrev.disabled = indiceAtual === 0;
        btnNext.disabled = indiceAtual === filaFria.length - 1;
    }

    btnPrev.onclick = () => {
        if (indiceAtual > 0) {
            indiceAtual--;
            renderizarClienteAtual();
        }
    };

    btnNext.onclick = () => {
        if (indiceAtual < filaFria.length - 1) {
            indiceAtual++;
            renderizarClienteAtual();
        }
    };

    /* ================= LOGIN ================= */
    onAuthStateChanged(auth, user => {
        if(user){
            currentUser = user;
            carregarFila();
            setupTwilio(); // Inicia a conexão com o Twilio
        }else{
            window.location.href = "login.html";
        }
    });

});
</script>

</head>
<body>

<div class="sidebar">
    <h2 onclick="window.location.href='dashboard.html'">AMR ADV</h2>
    <button onclick="window.location.href='crm.html'">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/dashboard.png"/>
        <span>CRM</span>
    </button>
    <button onclick="window.location.href='relatorios.html'">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/combo-chart.png"/>
        <span>Relatórios</span>
    </button>
    <button onclick="window.location.href='agenda.html'">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/calendar.png"/>
        <span>Agenda</span>
    </button>
    
    <!-- Botão de Contatos trocado para o Discador Twilio -->
    <button class="active-menu" onclick="window.location.href='discador.html'">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/phone.png"/>
        <span>Discador</span>
    </button>
    
    <button onclick="window.location.href='clientes.html'">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/user-group-man-man.png"/>
        <span>Clientes</span>
    </button>
    <button onclick="window.location.href='processos.html'">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/file.png"/>
        <span>Processos</span>
    </button>
    <button onclick="window.location.href='funil_geral.html'">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/filter.png"/>
        <span>Funil Geral</span>
    </button>
    <button onclick="window.location.href='andamento.html'">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/task.png"/>
        <span>Andamento</span>
    </button>
    <button onclick="window.location.href='adm.html'">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/manager.png"/>
        <span>ADM</span>
    </button>
</div>

<div class="main">
    <header>
        <h1>Discador da Lista Fria</h1>
    </header>

    <div class="dialer-container">
        
        <div class="dialer-card">
            
            <p id="twilioStatus">Inicializando...</p>

            <div class="dialer-header">
                <span class="badge" id="queueStatus">CARREGANDO...</span>
                <h2 id="clientName">Carregando dados...</h2>
            </div>

            <div class="client-info">
                <div class="info-box">
                    <strong>CPF / CNPJ</strong>
                    <span id="clientCpf">-</span>
                </div>
                <div class="info-box">
                    <strong>Estado</strong>
                    <span id="clientState">-</span>
                </div>
                <div class="info-box" style="grid-column: span 2;">
                    <strong>Processo</strong>
                    <span id="clientProcess">-</span>
                </div>
                <div class="info-box">
                    <strong>Valor da Causa</strong>
                    <span id="clientValue">R$ 0</span>
                </div>
            </div>

            <!-- Aqui entram os botões dinâmicos de ligação para cada número -->
            <div id="phonesList" class="phones-list">
                <!-- Javascript vai injetar aqui -->
            </div>

            <div class="nav-buttons">
                <button id="btnPrev" class="btn btn-nav" disabled>← Cliente Anterior</button>
                <button id="btnNext" class="btn btn-nav" disabled>Próximo Cliente →</button>
            </div>

        </div>

    </div>
</div>

<div class="toast" id="toast"></div>

</body>
</html>
