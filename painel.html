<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Controle do App</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f7f6;
        color: #333;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
    }
    .container {
        max-width: 900px;
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }
    .card {
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    h2 {
        font-size: 18px;
        margin-top: 0;
        border-bottom: 2px solid #b89754;
        padding-bottom: 10px;
    }
    .form-group {
        margin-bottom: 15px;
    }
    label {
        display: block;
        font-size: 14px;
        margin-bottom: 5px;
        font-weight: bold;
    }
    input, select, textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
    }
    button {
        background-color: #b89754;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
        font-weight: bold;
    }
    button:hover { background-color: #9c7f45; }
    
    /* Tabela Simples */
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 8px; text-align: left; border-bottom: 1px solid #eee; }
    
    /* Alerta na tela */
    #toast {
        position: fixed; top: 20px; right: 20px;
        background: #333; color: #fff; padding: 15px;
        border-radius: 5px; display: none; z-index: 1000;
    }
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

// Suas Credenciais
const firebaseConfig = {
    apiKey: "AIzaSyAFJJAqVf3ge0WDHBpmS9E6sXKvnjuFkhw",
    authDomain: "dapapp-38637.firebaseapp.com",
    projectId: "dapapp-38637",
    storageBucket: "dapapp-38637.firebasestorage.app",
    messagingSenderId: "628852295313",
    appId: "1:628852295313:web:1234567890abcdef123456"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.addEventListener('DOMContentLoaded', () => {

    const toast = document.getElementById('toast');
    function showToast(msg) {
        toast.innerText = msg;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
    }

    // Carregar clientes nos selects
   // Carregar clientes nos selects
    async function carregarClientes() {
        const selectAndamento = document.getElementById('clienteAndamento');
        const selectAlerta = document.getElementById('clienteAlerta');
        
        try {
            const snapshot = await getDocs(collection(db, "clientes"));
            let options = '<option value="" data-cpf="">Selecione...</option>';
            snapshot.forEach(doc => {
                const data = doc.data();
                // Agora salvamos o CPF escondido no data-cpf
                options += `<option value="${doc.id}" data-cpf="${data.cpf || ''}">${data.nome}</option>`;
            });
            selectAndamento.innerHTML = options;
            selectAlerta.innerHTML = '<option value="todos" data-cpf="todos">Todos os Clientes</option>' + options;
        } catch (error) {
            console.error("Erro ao buscar clientes:", error);
        }
    }

    // Carregar Negociações (Visualização Simples)
    async function carregarNegociacoes() {
        const tbody = document.getElementById('listaNegociacoes');
        try {
            const snapshot = await getDocs(collection(db, "negociacoes")); // Ajuste o nome da coleção se necessário
            let html = '';
            snapshot.forEach(doc => {
                const data = doc.data();
                html += `<tr><td>${data.nomeCliente || 'Desconhecido'}</td><td>${data.proposta || '-'}</td></tr>`;
            });
            tbody.innerHTML = html || '<tr><td colspan="2">Nenhuma proposta.</td></tr>';
        } catch (error) {
            tbody.innerHTML = '<tr><td colspan="2">Erro ao carregar.</td></tr>';
        }
    }

    carregarClientes();
    carregarNegociacoes();

    // 1. ADICIONAR CLIENTE (Cria a string 'fechado')
    document.getElementById('formAddCliente').onsubmit = async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        btn.innerText = "Salvando...";

        try {
            await addDoc(collection(db, "clientes"), {
                nome: document.getElementById('cliNome').value,
                cpf: document.getElementById('cliCpf').value,
                processo: document.getElementById('cliProcesso').value,
                status: "fechado", // Mecânica exigida
                dataCadastro: new Date().toISOString()
            });
            showToast("Cliente adicionado com status 'fechado'!");
            e.target.reset();
            carregarClientes();
        } catch (error) {
            showToast("Erro ao salvar cliente.");
        }
        btn.innerText = "Adicionar Cliente";
    };

    // 2. ANDAMENTO DE PROCESSO
    document.getElementById('formAndamento').onsubmit = async (e) => {
        e.preventDefault();
        const idCliente = document.getElementById('clienteAndamento').value;
        if (!idCliente) return showToast("Selecione um cliente.");

        const btn = e.target.querySelector('button');
        btn.innerText = "Enviando...";

        try {
            await updateDoc(doc(db, "clientes", idCliente), {
                dataUltimoAndamento: new Date().toISOString(),
                andamentoAtual: document.getElementById('descAndamento').value // Ajuste conforme seu DB
            });
            showToast("Andamento atualizado!");
            e.target.reset();
        } catch (error) {
            showToast("Erro ao atualizar andamento.");
        }
        btn.innerText = "Atualizar Andamento";
    };

    // 3. EMITIR ALERTA (Baseado no Swift enviado)
    // 3. EMITIR ALERTA (Baseado no Swift enviado)
    document.getElementById('formAlerta').onsubmit = async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        btn.innerText = "Enviando...";

        const selectAlerta = document.getElementById('clienteAlerta');
        const opcaoSelecionada = selectAlerta.options[selectAlerta.selectedIndex];
        const cpfDoCliente = opcaoSelecionada.getAttribute('data-cpf'); // Pega o CPF

        // Objeto formatado EXATAMENTE como o init() do seu App iOS espera
        const payloadAlerta = {
            titulo: document.getElementById('alertaTitulo').value,
            mensagem: document.getElementById('alertaMsg').value,
            data: new Date().toISOString(), 
            gravidade: document.getElementById('alertaGravidade').value.toLowerCase(), 
            destinoId: selectAlerta.value, 
            cpf: cpfDoCliente // <--- AQUI ESTÁ A MÁGICA! O App agora vai achar.
        };

        try {
            await addDoc(collection(db, "alertas"), payloadAlerta); 
            showToast("Alerta disparado para o App!");
            e.target.reset();
        } catch (error) {
            showToast("Erro ao enviar alerta.");
            console.error(error);
        }
        btn.innerText = "Emitir Alerta";
    };

        try {
            await addDoc(collection(db, "alertas"), payloadAlerta); // Coleção "alertas"
            showToast("Alerta disparado para o App!");
            e.target.reset();
        } catch (error) {
            showToast("Erro ao enviar alerta.");
            console.error(error);
        }
        btn.innerText = "Emitir Alerta";
    };
});
</script>
</head>
<body>

<div id="toast"></div>

<div class="container">
    <div class="card">
        <h2>Adicionar Cliente</h2>
        <form id="formAddCliente">
            <div class="form-group"><label>Nome</label><input type="text" id="cliNome" required></div>
            <div class="form-group"><label>CPF</label><input type="text" id="cliCpf" required></div>
            <div class="form-group"><label>Nº Processo</label><input type="text" id="cliProcesso"></div>
            <button type="submit">Adicionar Cliente</button>
        </form>
    </div>

    <div class="card">
        <h2>Passar Andamento</h2>
        <form id="formAndamento">
            <div class="form-group">
                <label>Cliente</label>
                <select id="clienteAndamento"></select>
            </div>
            <div class="form-group">
                <label>Descrição</label>
                <textarea id="descAndamento" rows="3" required></textarea>
            </div>
            <button type="submit">Atualizar Andamento</button>
        </form>
    </div>

    <div class="card">
        <h2>Emitir Alerta</h2>
        <form id="formAlerta">
            <div class="form-group"><label>Destino</label><select id="clienteAlerta"></select></div>
            <div class="form-group"><label>Título</label><input type="text" id="alertaTitulo" required></div>
            <div class="form-group">
                <label>Gravidade</label>
                <select id="alertaGravidade">
                    <option value="baixa">Baixa</option>
                    <option value="media">Média</option>
                    <option value="alta">Alta</option>
                </select>
            </div>
            <div class="form-group"><label>Mensagem</label><textarea id="alertaMsg" rows="2" required></textarea></div>
            <button type="submit">Emitir Alerta</button>
        </form>
    </div>

    <div class="card">
        <h2>Negociações Recebidas</h2>
        <table>
            <thead><tr><th>Cliente</th><th>Proposta</th></tr></thead>
            <tbody id="listaNegociacoes">
                <tr><td colspan="2">Carregando...</td></tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
